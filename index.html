<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sealed Hiring Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout concept: one quiet column of type on a plain page. Hairlines instead of boxes, and the redaction bar as the only ornament. */
:root {
  --paper: #ffffff;
  --ink: #0b0b0c;
  --muted: #6c6c72;
  --rule: #e6e6e9;
  --tint: #f5f5f6;
  --accent: #3457f5;
  --on-accent: #ffffff;
  --secondary: #9cc9ff;
  --on-secondary: #16120c;
  --hero-bg: #101a3f;
  --on-hero-bg: #ffffff;
  --wash: color-mix(in srgb, var(--accent) 9%, var(--paper));
  --wash-2: color-mix(in srgb, var(--secondary) 18%, var(--paper));
  --hero-soft: color-mix(in srgb, var(--hero-bg) 10%, var(--paper));
  --bar: #0b0b0c;
  --bar-ink: #9a9aa2;
  --good: #2444c9;
  --warn: #8a5300;
  --warn-soft: #fbf3e2;
  --bad: #a3263a;
  --bad-soft: #fbecee;
  --sans: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c0c0d; --ink: #f3f3f4; --muted: #9c9ca3; --rule: #27272b; --tint: #18181b; --bar: #000000; --bar-ink: #7d7d85;
    --good: #a3b8ff; --warn: #e8b868; --warn-soft: #2c2212; --bad: #f08a99; --bad-soft: #351820;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0c0c0d; --ink: #f3f3f4; --muted: #9c9ca3; --rule: #27272b; --tint: #18181b; --bar: #000000; --bar-ink: #7d7d85;
  --good: #a3b8ff; --warn: #e8b868; --warn-soft: #2c2212; --bad: #f08a99; --bad-soft: #351820;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-weight: 500; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.05; letter-spacing: -0.035em; }
h2 { font-size: 1.3rem; line-height: 1.25; letter-spacing: -0.015em; }
h3 { font-size: 1rem; line-height: 1.4; }
h2.prompt { font-size: clamp(1.4rem, 3.6vw, 1.8rem); line-height: 1.2; letter-spacing: -0.025em; }
p { margin: 0; }
a { color: inherit; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.lede { font-size: 1.1rem; color: var(--muted); }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.code { font-family: var(--mono); font-weight: 500; letter-spacing: 0.02em; white-space: nowrap; }
h1.code { font-size: clamp(1.7rem, 5vw, 2.4rem); letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }

/* Layout */
.top { border-bottom: 1px solid var(--rule); padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1040px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 28px; min-height: 64px; padding-block: 10px; }
.top.dark { background: var(--hero-bg); border-color: var(--hero-bg); color: var(--on-hero-bg); }
.brand { font: 600 1.05rem var(--sans); letter-spacing: -0.02em; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center; }
.logo { height: 16px; width: auto; max-width: 180px; display: block; }
.nav { display: flex; flex-wrap: wrap; gap: 2px 20px; flex: 1; min-width: 0; }
.nav button, .signout { background: none; border: 0; color: inherit; opacity: 0.55; font: 400 0.94rem var(--sans); padding: 4px 0; cursor: pointer; }
.nav button:hover, .signout:hover, .nav button.on { opacity: 1; box-shadow: 0 2px 0 var(--accent); }
.page { max-width: 1040px; margin: 0 auto; padding-block: clamp(36px, 7vw, 72px) 96px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 32px; grid-template-columns: minmax(0, 1fr); }
.page.narrow { max-width: 680px; }
.stack { display: grid; gap: 14px; min-width: 0; align-content: start; grid-template-columns: minmax(0, 1fr); }
.stack.lg { gap: 32px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.row.end { justify-content: flex-end; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 20px; }
.panel { background: var(--wash); border-radius: 12px; padding: 20px; }
.eyebrow { font-size: 0.875rem; color: var(--muted); }

/* Controls */
.btn { font: 500 0.95rem var(--sans); padding: 10px 20px; border-radius: 999px; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; min-height: 44px; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(0.93); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.quiet { background: none; border: 0; padding: 4px 0; color: var(--muted); font: 400 0.94rem var(--sans); cursor: pointer; text-decoration: none; }
.quiet:hover { color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.field { display: grid; gap: 6px; font-weight: 500; font-size: 0.94rem; min-width: 0; }
.hint { font-weight: 400; color: var(--muted); font-size: 0.875rem; }
input[type=text], input[type=email], input[type=tel], input[type=password], input[type=number], input[type=datetime-local], textarea, select {
  width: 100%; font: 400 1rem var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 10px; padding: 11px 13px; min-width: 0;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--wash); }
input[type=file] { font: 400 0.9rem var(--sans); max-width: 100%; }
input[type=color] { width: 52px; height: 36px; padding: 0; background: none; border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; }
textarea { min-height: 160px; resize: vertical; line-height: 1.6; }
.check, .choice { display: flex; gap: 10px; align-items: flex-start; font-size: 0.95rem; font-weight: 400; }
.check input, .choice input { margin-top: 5px; width: 16px; height: 16px; flex: none; accent-color: var(--accent); }
.must { border: 0; padding: 0 0 14px; margin: 0; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; min-width: 0; }
.must legend { font-weight: 500; font-size: 0.94rem; padding: 0; margin-bottom: 8px; }
.must .row { gap: 22px; }
.hp { position: absolute; left: -9999px; height: 0; overflow: hidden; }
.error { background: var(--bad-soft); color: var(--bad); padding: 11px 14px; border-radius: 10px; }
.notice { background: var(--wash-2); padding: 14px 16px; border-radius: 12px; }
.warn { background: var(--warn-soft); color: var(--warn); padding: 11px 14px; border-radius: 10px; font-size: 0.94rem; }
.over { color: var(--bad); font-weight: 500; }

/* Status */
.pill { display: inline-block; font-size: 0.8rem; padding: 2px 11px; border-radius: 999px; background: var(--tint); color: var(--muted); white-space: nowrap; }
.pill.open, .pill.advanced, .pill.sent { background: color-mix(in srgb, var(--good) 15%, var(--paper)); color: var(--good); }
.pill.closed { background: var(--hero-soft); color: var(--ink); }
.pill.discuss, .pill.queued { background: var(--warn-soft); color: var(--warn); }
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 1fr)); gap: 10px; margin: 0; }
.tally > div { padding: 16px 20px; border-radius: 14px; background: var(--tint); }
.tally .tally-hero { background: var(--hero-bg); color: var(--on-hero-bg); }
.tally .tally-accent { background: var(--accent); color: var(--on-accent); }
.tally .tally-secondary { background: var(--secondary); color: var(--on-secondary); }
.tally dt { font-size: 0.875rem; opacity: 0.85; }
.tally dd { margin: 0; font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.15; letter-spacing: -0.03em; }

/* Redaction bar */
.bar { display: inline-block; background: var(--bar); color: var(--bar-ink); font: 500 0.66rem/1.55 var(--mono); padding: 1px 8px; vertical-align: 1px; border-radius: 2px; white-space: nowrap; }

/* Stepper */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; list-style: none; margin: 0; padding: 0; }
.steps li { border-top: 2px solid var(--rule); padding-top: 8px; font-size: 0.875rem; color: var(--muted); min-width: 0; }
.steps li.on { border-color: var(--accent); color: var(--ink); }
.steps li.done { border-color: var(--accent); }

/* Scoring */
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scale button { border: 1px solid var(--rule); background: transparent; color: var(--muted); border-radius: 10px; padding: 12px 2px; cursor: pointer; font: 400 0.72rem/1.25 var(--sans); min-width: 0; }
.scale b { display: block; font: 500 1.3rem var(--sans); color: var(--ink); }
.scale button:hover { border-color: var(--accent); background: var(--wash); }
.scale button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.scale button[aria-pressed=true] b { color: var(--on-accent); }
.meter { height: 2px; background: var(--rule); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.answer { font-size: 1.15rem; line-height: 1.65; }

/* Tables and lists */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th { text-align: left; font-size: 0.875rem; color: var(--muted); font-weight: 400; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--rule); vertical-align: bottom; white-space: nowrap; }
td { padding: 14px 12px 14px 0; border-bottom: 1px solid var(--rule); vertical-align: middle; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--wash); }
.scorecell { font-weight: 500; font-size: 1.05rem; }
.bigscore { font-size: clamp(1.7rem, 5vw, 2.4rem); letter-spacing: -0.03em; }
.role-row { display: grid; gap: 6px; padding: 20px 22px; border-radius: 14px; background: var(--wash); }
.role-row + .role-row { margin-top: 10px; }
.aside { display: flex; flex-wrap: wrap; gap: 4px 20px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); color: var(--ink); font: 400 0.95rem/1.5 var(--sans); padding: 14px 0; cursor: pointer; }
.aside:hover { background: var(--wash-2); }
.qcard { border-bottom: 1px solid var(--rule); padding-bottom: 22px; display: grid; gap: 12px; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
.qa { border-top: 1px solid var(--rule); padding-top: 24px; }
.score-list { display: grid; gap: 2px; font-size: 0.9rem; }
.kv { display: grid; grid-template-columns: minmax(80px, auto) minmax(0, 1fr); gap: 6px 16px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.logo-preview { min-height: 64px; display: flex; align-items: center; padding: 16px 20px; border-radius: 12px; background: var(--tint); font-weight: 600; letter-spacing: -0.02em; }
.logo-preview.dark { background: var(--hero-bg); color: var(--on-hero-bg); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 20px; border-radius: 999px; font-size: 0.94rem; z-index: 30; max-width: calc(100vw - 32px); }

/* Emails page */
.mail-list { border-top: 1px solid var(--rule); }
.mail-row { display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--rule); }
.mail-row.on { box-shadow: inset 2px 0 0 var(--accent); padding-left: 14px; }
.mail-pick { flex: 1; min-width: 0; display: grid; gap: 1px; text-align: left; background: none; border: 0; color: inherit; padding: 13px 0; cursor: pointer; font: inherit; }
.mail-name { font-weight: 500; }
.switch { position: relative; flex: none; width: 40px; height: 24px; cursor: pointer; }
.switch input { position: absolute; inset: 0; margin: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--rule); pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #ffffff; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { left: 18px; background: #ffffff; }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.mail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 40px; align-items: start; }
.stage { display: grid; gap: 14px; justify-items: center; min-width: 0; background: var(--wash-2); border-radius: 16px; padding: 20px 12px; }
.seg { gap: 4px; }
.seg button { background: none; border: 0; color: var(--muted); font: 400 0.875rem var(--sans); padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.seg button.on { background: var(--paper); color: var(--ink); }
/* The email itself keeps its own light colours in every theme, as it does in a mail app. */
.device { --mail-ink: #111113; --mail-muted: #6c6c72; --mail-rule: #e6e6e9; width: 100%; background: #ffffff; color: var(--mail-ink); overflow: hidden; }
.device.phone { max-width: 375px; border-radius: 28px; border: 6px solid #0b0b0c; }
.device.desktop { max-width: 600px; border-radius: 10px; border: 1px solid var(--rule); }
.device-meta { padding: 16px 18px 12px; border-bottom: 1px solid var(--mail-rule); }
.device-from { font-weight: 600; font-size: 0.875rem; }
.device-subject { font-size: 0.875rem; color: var(--mail-muted); }
.mail { font: 400 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.mail-head { padding: 22px 24px; font-weight: 600; letter-spacing: -0.02em; color: var(--mail-ink); background: #ffffff; }
.mail-head.dark { background: #000000; color: #ffffff; }
.mail-logo { height: 16px; width: auto; max-width: 180px; display: block; }
.mail-head { padding-bottom: 14px; }
.mail-hero { padding: 6px 24px 30px; background: #ffffff; color: var(--mail-ink); }
.mail-hero.dark { background: #000000; color: #ffffff; }
.mail-hero i { display: block; width: 44px; height: 6px; margin-bottom: 18px; }
.mail-hero h2 { font: inherit; font-size: 32px; line-height: 1.12; font-weight: 600; letter-spacing: -0.02em; }
.mail-steps { padding: 22px 24px 0; }
.mail-bars { display: flex; gap: 3px; }
.mail-bars i { flex: 1; height: 4px; background: var(--mail-rule); }
.mail-steps p { margin-top: 10px; font-size: 13px; color: var(--mail-muted); }
.mail-body { padding: 28px 24px; display: grid; gap: 18px; }
.mail-p { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--mail-ink); }
.mail-cta { background: #111113; color: #ffffff; text-align: center; font-weight: 500; font-size: 16px; padding: 14px 20px; border-radius: 999px; }
.mail-foot { padding: 18px 24px 24px; border-top: 1px solid var(--mail-rule); color: var(--mail-muted); font-size: 13px; line-height: 1.5; }

.block { display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; padding: 2px 11px; border: 1px solid var(--rule); border-radius: 999px; font-size: 0.82rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
select.inline { width: auto; padding: 6px 10px; font-size: 0.92rem; }
.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px 28px; margin: 0; }
.levels dt { font-weight: 500; }
.levels dd { margin: 0; color: var(--muted); font-size: 0.92rem; }

.back { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 7px 16px 7px 12px; border: 0; border-radius: 999px; background: var(--wash); color: var(--ink); font: 500 0.94rem var(--sans); cursor: pointer; }
.back:hover { background: color-mix(in srgb, var(--accent) 20%, var(--paper)); }
.swatches { display: flex; flex-wrap: wrap; gap: 20px 32px; }

/* Hero */
.hero { position: relative; overflow: hidden; background: var(--hero-bg); color: var(--on-hero-bg); --muted: color-mix(in srgb, var(--on-hero-bg) 76%, var(--hero-bg)); padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px)); }
/* A sun and an arc: simple shapes that take on whatever colours the brand sets. */
.hero::before { content: ""; position: absolute; right: -70px; top: -70px; width: 260px; height: 260px; border-radius: 50%; background: var(--secondary); }
.hero::after { content: ""; position: absolute; right: 24px; bottom: -130px; width: 240px; height: 240px; border-radius: 50%; border: 34px solid var(--accent); }
/* Below this width the text needs the room, so the shapes step back. */
@media (max-width: 1240px) {
  .hero::before { width: 150px; height: 150px; right: -60px; top: -60px; }
  .hero::after { display: none; }
}
.hero-in { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; padding-block: clamp(36px, 8vw, 80px); display: grid; gap: 14px; }
.hero-in.narrow { max-width: 640px; }
.hero-in h1 { font-size: clamp(2.4rem, 8vw, 4.2rem); line-height: 1; }
.hero .lede { color: var(--muted); max-width: 58ch; }
.hero .eyebrow { color: var(--muted); }
.hero-mark { display: block; width: 56px; height: 7px; background: var(--accent); }

/* Pipeline */
.funnel { display: flex; gap: 10px; overflow-x: auto; align-items: flex-start; padding-bottom: 4px; }
.funnel-step { flex: 1 0 84px; min-width: 84px; display: grid; gap: 1px; align-content: start; }
.funnel-bar { height: 76px; display: flex; align-items: flex-end; margin-bottom: 6px; border-bottom: 1px solid var(--rule); }
.funnel-bar i { display: block; width: 100%; border-radius: 6px 6px 0 0; background: var(--accent); }
.funnel-step:nth-child(-n+2) .funnel-bar i { background: var(--secondary); }
.funnel-num { font-size: 1.5rem; line-height: 1.1; letter-spacing: -0.02em; }
.kanban { display: flex; gap: 12px; overflow-x: auto; align-items: flex-start; padding-bottom: 12px; scroll-snap-type: x proximity; }
.column { flex: 0 0 min(268px, 80vw); background: var(--wash); border-radius: 12px; padding: 12px; display: grid; gap: 8px; scroll-snap-align: start; min-height: 150px; align-content: start; }
.column.over { outline: 2px solid var(--accent); outline-offset: -2px; }
.column-head { display: flex; gap: 8px; align-items: baseline; padding: 2px 2px 6px; }
.column-head h3 { flex: 1; min-width: 0; font-weight: 500; }
.empty { padding: 2px; }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.card[draggable=true] { cursor: grab; }
.card.lifted { opacity: 0.45; }
.card.stalled { border-color: var(--warn); }
.card-open { display: grid; gap: 1px; text-align: left; background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
.card-open strong { font-weight: 500; }
.card-meta { gap: 6px; font-size: 0.875rem; }
.card-move { width: 100%; padding: 5px 8px; font-size: 0.85rem; color: var(--muted); }
.stage-log { border-top: 1px solid var(--rule); padding-top: 14px; }
details summary { cursor: pointer; list-style-position: inside; }

/* Checklist, timeline, account */
.setup { list-style: none; margin: 0; padding: 0; display: grid; }
.setup li { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding-block: 8px; border-top: 1px solid var(--rule); }
.setup li.done > .grow { color: var(--muted); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { position: relative; padding: 0 0 22px 26px; display: grid; color: var(--muted); }
.timeline li::before { content: ""; position: absolute; left: 0; top: 7px; width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--rule); background: var(--paper); z-index: 1; }
.timeline li::after { content: ""; position: absolute; left: 5px; top: 12px; bottom: -7px; width: 1px; background: var(--rule); }
.timeline li:last-child { padding-bottom: 0; }
.timeline li:last-child::after { display: none; }
.timeline li.done { color: var(--ink); }
.timeline li.done::before { background: var(--accent); border-color: var(--accent); }
.timeline li.done::after { background: var(--accent); }
.wrap { white-space: normal; overflow-wrap: anywhere; }
.qr { width: 180px; height: 180px; background: #ffffff; padding: 8px; border-radius: 10px; }
.recovery { word-spacing: 0.4em; line-height: 1.9; }
.keys { display: none; }
@media (hover: hover) and (min-width: 700px) { .keys { display: inline; } }

// Removes details that identify an applicant from their answers.
// Runs before anything is stored, so the original text never reaches reviewers.

const TLDS = 'com\\.au|net\\.au|org\\.au|co\\.nz|com|org|net|io|co|ai|dev|app|me|au|nz';
const EMAIL = /[\p{L}\p{N}._%+-]+@[\p{L}\p{N}-]+(?:\.[\p{L}\p{N}-]+)+/gu;
const URL_RE = new RegExp(`(?:\\bhttps?:\\/\\/|\\bwww\\.)\\S+|\\b[a-z0-9-]+\\.(?:${TLDS})(?:\\/\\S*)?(?![\\w.-]*\\w)`, 'gi');
const PHONE = /(?<![\w.])\+?\(?\d[\d\s().-]{6,18}\d(?![\w])/g;
const HANDLE = /(?<![\w.])@[A-Za-z0-9_]{2,}/g;

const HINTS = [
  [/\bmy name is\b/i, 'You mention your name directly.'],
  [/\b(?:i am|i'm) \d{2}\b|\b\d{2} years old\b|\bborn in\b/i, 'You mention your age or birth year.'],
  [/\bmy (?:wife|husband|son|daughter|father|mother|dad|mum|mom)\b/i, 'You mention a family member, which can reveal personal details.'],
  [/\bgraduated (?:from|in)\b|\balma mater\b/i, 'You mention where or when you studied. Consider whether reviewers need that detail.'],
];

const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const titleCase = (s) => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();

function looksLikePhone(match) {
  const digits = match.replace(/\D/g, '');
  if (digits.length < 8 || digits.length > 15) return false;
  // Year ranges like "2019-2021" have enough digits but are not phone numbers.
  const groups = match.match(/\d+/g);
  if (groups.every((g) => /^(?:19|20)\d{2}$/.test(g))) return false;
  if (/^[+(0]/.test(match)) return true;
  return /^\d{3}[\s.-]\d{3}[\s.-]\d{4}$/.test(match);
}

function nameForms(contact) {
  const forms = new Set();
  const first = String(contact?.first_name ?? '').trim();
  const last = String(contact?.last_name ?? '').trim();
  if (first && last) forms.add(`${first} ${last}`);
  for (const whole of [first, last]) {
    if (whole) forms.add(whole);
    for (const part of whole.split(/[\s-]+/)) {
      if (part.length >= 2) forms.add(part);
    }
  }
  // Matching is case sensitive on purpose: "Will" the name is removed, "will" the word is not.
  const out = new Set();
  for (const f of forms) {
    const cased = f.split(' ').map((w) => w.split('-').map(titleCase).join('-')).join(' ');
    out.add(cased);
    out.add(f);
    out.add(f.toUpperCase());
  }
  return [...out].sort((a, b) => b.length - a.length);
}

function redact(input, contact) {
  let text = String(input ?? '');
  const found = [];
  const swap = (re, type, keep = () => true) => {
    text = text.replace(re, (m) => {
      const trailing = m.match(/[.,;:!?)\]'"]+$/)?.[0] ?? '';
      const core = trailing ? m.slice(0, -trailing.length) : m;
      if (!core || !keep(core)) return m;
      found.push({ type, value: core });
      return `[${type} removed]${trailing}`;
    });
  };

  swap(EMAIL, 'email');
  swap(URL_RE, 'link');
  swap(PHONE, 'phone', looksLikePhone);
  swap(HANDLE, 'handle');
  const names = nameForms(contact);
  if (names.length) {
    swap(new RegExp(`(?<![\\p{L}\\p{N}])(?:${names.map(escapeRe).join('|')})(?![\\p{L}\\p{N}])`, 'gu'), 'name');
  }

  const hints = HINTS.filter(([re]) => re.test(text)).map(([, msg]) => msg);
  return { text, found, hints };
}

// The rule half of the first scan. No AI, and it never sees contact details.

const words = (s) => String(s ?? '').toLowerCase().match(/[\p{L}\p{N}']+/gu) ?? [];

function overlap(a, b) {
  if (!a.size || !b.size) return 0;
  let shared = 0;
  for (const x of a) if (b.has(x)) shared += 1;
  return shared / (a.size + b.size - shared);
}
function threeWordRuns(text) {
  const w = words(text);
  const runs = new Set();
  for (let i = 0; i + 2 < w.length; i += 1) runs.add(`${w[i]} ${w[i + 1]} ${w[i + 2]}`);
  return runs;
}

// Returns reasons. "hard" means the role's stated requirement was not met, so spot-checks skip it.
function ruleCheck({ questions, answers, mustHaveNo = [], others = [], rules = {} }) {
  const hard = mustHaveNo.map((m) => `Answered no to a requirement: ${m}`);
  const soft = [];
  const texts = questions.map((q) => answers[q.id] ?? '');

  questions.forEach((q, i) => {
    const w = words(texts[i]);
    const label = (q.position ?? i) + 1;
    if (rules.repeat_question !== false && overlap(new Set(w), new Set(words(q.prompt))) > 0.75) soft.push(`Answer ${label} repeats the question.`);
    if (rules.low_variety !== false && w.length >= 15 && new Set(w).size / w.length < 0.35) soft.push(`Answer ${label} is mostly repeated words.`);
  });
  for (let i = 0; rules.same_answer !== false && i < texts.length; i += 1) {
    for (let j = i + 1; j < texts.length; j += 1) {
      if (words(texts[i]).length >= 5 && overlap(threeWordRuns(texts[i]), threeWordRuns(texts[j])) > 0.8) {
        soft.push(`Answers ${i + 1} and ${j + 1} are the same text.`);
      }
    }
  }
  const mine = threeWordRuns(texts.join(' '));
  if (rules.near_copy !== false && mine.size >= 15) {
    const copy = others.find((o) => overlap(mine, threeWordRuns(o.text)) > 0.7);
    if (copy) soft.push(`Nearly identical to application ${copy.code}.`);
  }
  return { hard, soft };
}

// A browser-only stand-in for the server, used by the public demo. Nothing leaves the page.
window.__sealedDemo = (() => {
  const GRACE = 15;
  let db;
  let persona;
  let seq;
  let currentQuery = new URLSearchParams();
  const fail = (status, message) => { throw Object.assign(new Error(message), { status }); };
  const uid = () => `id${++seq}`;
  const newCode = () => {
    const abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    return Array.from({ length: 6 }, (_, i) => (i === 3 ? '-' : '') + abc[Math.floor(Math.random() * abc.length)]).join('');
  };
  const log = (actor, action, code, detail) => db.audit.unshift({ at: Date.now(), actor, action, code: code ?? null, detail: detail ?? '' });
  const mail = (subject, code, status = 'queued') => db.emails.unshift({ subject, code: code ?? null, status, send_after: Date.now() + (status === 'queued' ? GRACE * 60_000 : 0), sent_at: status === 'sent' ? Date.now() : null, error: null });
  const fillQuestions = (qs) => qs.map((q) => ({ id: uid(), prompt: q.prompt, guidance: q.guidance, word_limit: q.word_limit, weight: q.weight, min_words: q.min_words ?? 0, screened: q.screened === false || q.screened === 0 ? 0 : 1 }));
  const DEFAULT_RULES = { repeat_question: true, same_answer: true, low_variety: true, near_copy: true, ai: true, ai_bar: 'low', extra_check: '' };
  const QUEUE = ['through', 'sampled', 'restored'];

  const blindStage = (r, st) => st.type === 'task' && r.stages.filter((x) => x.position < st.position).every((x) => x.type === 'task');

  function reset() {
    seq = 0;
    const now = Date.now();
    db = {

      brand: { accent: '#3457f5', secondary: '#9cc9ff', hero: '#101a3f', header: 'dark', logo: null, font: 'Geist', icon: null, tagline: 'Back the founders shaping what comes next. We read your thinking first, and your name last.', ...(window.__sealedBrand?.brand ?? {}) },

      subjects: { confirm: 'We received your application for {{role}}', advance: 'Next steps for {{role}}', decline: 'Your application for {{role}}' },

        confirm: 'Hi {{first_name}},\n\nThanks for applying for {{role}} at {{org}}. Your reference is {{code}}.\n\nCheck progress or withdraw here:\n{{status_link}}',
        advance: 'Hi {{first_name}},\n\nGood news. Your answers for {{role}} scored highly and we would like to meet you.',
        decline: 'Hi {{first_name}},\n\nThank you for applying for {{role}}. We have decided not to move forward this time. This decision was made without anyone seeing your name or contact details.',
      },
      users: demoData.team.map((t) => ({ id: t.key, name: t.name, email: t.email, role: t.role, master: Boolean(t.master), areas: [...t.areas], joined: 1 })),
      areas: ['Investment', 'Platform', 'Operations'],
      roles: [], apps: [], scores: [],
    };
    const open = {
      id: uid(), slug: 'investment-analyst', title: demoData.openRole.title, summary: demoData.openRole.summary, description: demoData.openRole.description,
      closes_at: now + 14 * 86_400_000, status: 'open', reviewers: [...demoData.openRole.reviewers], questions: fillQuestions(demoData.openRole.questions),
      must_haves: [...demoData.openRole.must_haves], scan_enabled: true, sample_percent: 10,
      stages: makeStages(), area: demoData.openRole.area, reviews_per: demoData.openRole.reviews_per, leads: [...demoData.openRole.leads], scan_rules: { ...DEFAULT_RULES },
    };
    const closed = {
      id: uid(), slug: 'platform-associate', title: demoData.closedRole.title, summary: demoData.closedRole.summary, description: demoData.closedRole.description,
      closes_at: now - 3 * 86_400_000, status: 'closed', reviewers: [...demoData.closedRole.reviewers], questions: fillQuestions(demoData.closedRole.questions),
      must_haves: [], scan_enabled: true, sample_percent: 10,
      stages: makeStages(), area: demoData.closedRole.area, reviews_per: demoData.closedRole.reviews_per, leads: [...demoData.closedRole.leads], scan_rules: { ...DEFAULT_RULES },

        if (a.scores[i + 2] != null) db.scores.push({ app: app.id, q: q.id, reviewer: 'sam', score: a.scores[i + 2], note: '' });
      });

      db.apps.push(app);
      syncAssign(closed);
      if (a.moveTo) {
        const st = closed.stages.find((x) => x.name === a.moveTo);
        Object.assign(app, { status: 'advanced', stage_id: st.id, entered_at: now - 2 * 86_400_000, opened: Boolean(a.opened), events: [{ stage: st.id, at: now - 2 * 86_400_000 }], work: a.work ? { [st.id]: { text: a.work, submitted_at: now - 86_400_000 } } : {}, feedback: [] });

  }
  // Gives each application to the reviewers with the fewest, as the real server does.
  function syncAssign(r) {
    const want = r.reviews_per > 0 ? Math.min(r.reviews_per, r.reviewers.length) : r.reviewers.length;
    const load = Object.fromEntries(r.reviewers.map((k) => [k, 0]));
    const live = db.apps.filter((a) => a.role_id === r.id && a.status === 'submitted');
    for (const a of live) {
      a.assigned = QUEUE.includes(a.scan) ? (a.assigned ?? []).filter((k) => k in load) : [];
      a.assigned.forEach((k) => { load[k] += 1; });
    }
    for (const a of live.filter((x) => QUEUE.includes(x.scan))) {
      while (a.assigned.length > want) {
        const free = a.assigned.find((k) => !db.scores.some((s) => s.app === a.id && s.reviewer === k));
        if (!free) break;
        a.assigned = a.assigned.filter((k) => k !== free);
        load[free] -= 1;
      }
      const options = r.reviewers.filter((k) => !a.assigned.includes(k)).sort((x, y) => load[x] - load[y]);
      for (const k of options.slice(0, Math.max(want - a.assigned.length, 0))) {
        a.assigned.push(k);
        load[k] += 1;
      }
    }
  }

  // Rule checks are real. The AI part is a stand-in, because a demo page makes no outside calls.
  function runScan(r, app, mustHaveNo, fixture) {
    const others = db.apps.filter((a) => a.role_id === r.id && a.status !== 'withdrawn').map((a) => ({ code: a.code, text: Object.values(a.answers).join(' ') }));
    const screened = r.questions.filter((q) => q.screened);
    const rules = r.scan_rules ?? DEFAULT_RULES;
    const { hard, soft } = ruleCheck({ questions: screened.map((q) => ({ ...q, position: r.questions.indexOf(q) })), answers: app.answers, mustHaveNo, others, rules });
    const ai = rules.ai === false ? [] : r.questions.flatMap((q, i) => {

    ['GET', /^\/api\/roles\/([^/]+)\/pipeline$/, (id) => {
      const r = role(id);
      const admin = isLead(r);
      const live = appsOf(id);
      const reached = (st) => live.filter((a) => (a.events ?? []).some((e) => e.stage === st.id));
      const days = (st) => {
        const list = reached(st);
        if (!list.length) return null;
        return Math.round((list.reduce((n, a) => n + (Date.now() - a.events.find((e) => e.stage === st.id).at), 0) / list.length / 86_400_000) * 10) / 10;
      };
      return {
        role: r, is_admin: admin,
        funnel: [
          { label: 'Applied', count: live.length },
          { label: 'To read', count: live.filter((a) => a.scan !== 'set_aside').length },
          ...r.stages.map((st) => ({ label: st.name, count: reached(st).length, days: days(st) })),
        ],
        stages: r.stages.map((st) => ({
          id: st.id, name: st.name, type: st.type, blind: blindStage(r, st), stall_days: st.stall_days,
          cards: live.filter((a) => a.stage_id === st.id && a.status === 'advanced').map((a) => {
            const cards = (a.feedback ?? []).filter((f) => f.stage === st.id);
            const waited = (Date.now() - a.entered_at) / 86_400_000;
            const mine = cards.some((f) => f.user === me().id);
            return {
              code: a.code, name: a.opened && identityOpen(r, a) ? `${a.contact.first_name} ${a.contact.last_name}` : null, days: Math.floor(waited), stalled: st.type !== 'hired' && waited >= st.stall_days,
              work_in: Boolean(a.work?.[st.id]), cards_in: cards.length,
              score: (admin || mine) && cards.length ? Math.round((cards.reduce((n, f) => n + f.score, 0) / cards.length) * 10) / 10 : null,
            };
          }),
        })),
      };
    }],
    ['POST', /^\/api\/roles\/([^/]+)\/stages$/, (id, b) => {
      const r = role(id);
      for (const old of r.stages) {
        if (!b.stages.some((x) => x.id === old.id) && appsOf(id).some((a) => a.stage_id === old.id)) fail(409, `People are at ${old.name}. Move them before removing it.`);
      }
      r.stages = b.stages.map((x, i) => {
        if (!String(x.name ?? '').trim()) fail(400, `Stage ${i + 1} needs a name.`);
        return { booking_url: '', prompt: '', due_days: 7, stall_days: 5, email_text: '', ...x, id: x.id ?? uid(), position: i };
      });
      log(me().name, 'stages_updated', null, r.title);
      return { ok: true };
    }],
    ['POST', /^\/api\/roles\/([^/]+)\/applications\/([^/]+)\/move$/, (id, code, b) => {
      const r = role(id);
      const a = appBy(id, code);
      const target = r.stages.find((x) => x.id === b.stage_id) ?? fail(404, 'We could not find that stage.');
      const current = r.stages.find((x) => x.id === a.stage_id);
      if (a.opened && blindStage(r, target)) fail(409, 'This person’s name has been opened, so they cannot go back to an anonymous stage.');
      const forward = !current || target.position > current.position;
      enter(r, a, target, forward);
      log(me().name, 'stage_moved', code, `${current?.name ?? 'Advanced'} to ${target.name}`);
      return { ok: true, emailed: forward };
    }],
    ['POST', /^\/api\/roles\/([^/]+)\/applications\/([^/]+)\/feedback$/, (id, code, b) => {
      const a = appBy(id, code);
      a.feedback ??= [];
      const existing = a.feedback.find((f) => f.stage === a.stage_id && f.user === me().id);
      if (existing) Object.assign(existing, { score: b.score, note: b.note ?? '' });
      else a.feedback.push({ stage: a.stage_id, user: me().id, score: b.score, note: b.note ?? '' });
      return { ok: true };
    }],
    ['POST', /^\/api\/roles\/([^/]+)\/applications\/([^/]+)\/decline-stage$/, (id, code) => {
      const r = role(id);
      const a = appBy(id, code);
      a.status = 'declined';
      a.stage_id = null;
      log(me().name, 'declined', code, r.title);
      mail(`Your application for ${r.title}`, code);
      return { ok: true };
    }],
    ['GET', /^\/api\/roles\/([^/]+)\/applications\/([^/]+)\/identity$/, (id, code) => {
      const a = appBy(id, code);

    }],
    ['POST', /^\/api\/roles\/([^/]+)\/decline-rest$/, (id) => {
      const r = role(id);

    }],
    ['GET', /^\/api\/users$/, () => ({ users: db.users, areas: db.areas })],
    ['POST', /^\/api\/users\/([^/]+)\/access$/, (id, b) => {
      const u = db.users.find((x) => x.id === id);

        u.master = b.access === 'master';
        u.role = b.access === 'reviewer' ? 'reviewer' : 'admin';

      }
      if (b.areas) u.areas = b.areas;
      if (!u.master) {
        for (const r of db.roles.filter((x) => x.status !== 'closed' && x.area && u.areas.includes(x.area))) {
          const list = u.role === 'admin' ? r.leads : r.reviewers;
          if (!list.includes(id)) list.push(id);
          syncAssign(r);
        }
      }
      return { ok: true };
    }],
    ['POST', /^\/api\/roles\/([^/]+)\/rescan$/, (id) => {
      const r = role(id);
      const apps = appsOf(id).filter((a) => a.status === 'submitted' && a.scan !== 'restored' && !db.scores.some((s) => s.app === a.id));
      for (const a of apps) {
        if (r.scan_enabled) {
          const fixture = demoData.closedRole.applicants.find((x) => x.contact.email === a.contact.email);
          runScan(r, a, [], fixture);
        } else {
          a.scan = 'through';
          a.reasons = [];
        }
      }
      syncAssign(r);
      log(me().name, 'scan_rerun', null, `${r.title}: ${apps.length} applications`);
      return { rescanned: apps.length };
    }],
    ['POST', /^\/api\/users$/, (b) => {
      if (!String(b.name ?? '').trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(b.email ?? '')) fail(400, 'Enter a name and a valid email address.');
      const id = uid();
      db.users.push({ id, name: b.name, email: b.email, role: b.role === 'reviewer' ? 'reviewer' : 'admin', master: b.role === 'master', areas: b.areas ?? [], joined: 0 });
      log(me().name, 'team_invited', null, b.name);
      return { id, invite_url: 'https://your-domain.example/invite/one-time-link' };
    }],
    ['POST', /^\/api\/users\/([^/]+)\/reset$/, () => ({ invite_url: 'https://your-domain.example/invite/one-time-link' })],
    ['POST', /^\/api\/users\/([^/]+)\/remove$/, (id) => {
      db.users = db.users.filter((u) => u.id !== id);
      db.roles.forEach((r) => { r.reviewers = r.reviewers.filter((k) => k !== id); r.leads = (r.leads ?? []).filter((k) => k !== id); syncAssign(r); });
      return { ok: true };
    }],
    ['GET', /^\/api\/settings$/, () => ({ org_name: db.org, retention_days: db.retention, templates: { ...db.templates }, mail_configured: true, ai_available: true, grace_minutes: GRACE, areas: [...db.areas], brand: { ...db.brand }, subjects: { ...db.subjects }, auto: { ...db.auto }, privacy_notice: db.privacy, fonts: ['Geist', 'DM Sans', 'Manrope', 'Libre Franklin', 'IBM Plex Sans', 'Source Serif 4', 'Fraunces'] })],
    ['PUT', /^\/api\/settings$/, (b) => { db.org = b.org_name; db.retention = b.retention_days; db.templates = b.templates; if (Array.isArray(b.areas)) db.areas = b.areas; db.brand = { ...b.brand }; db.subjects = b.subjects; db.auto = b.auto; db.privacy = b.privacy_notice; return { ok: true }; }],
    ['GET', /^\/api\/activity$/, () => ({ audit: db.audit, emails: db.emails, mail_configured: true })],
  ];

  return {
    start: '/apply/investment-analyst',
    currentUser: me,
    brand: () => ({ ...db.brand, name: db.org }),
    sampleFor(slug, questions) {
      if (slug !== 'investment-analyst' || db.applied) return null;
      const s = demoData.openRole.sample;
      return { must_haves: demoData.openRole.must_haves.map(() => true), contact: { ...s.contact }, answers: Object.fromEntries(questions.map((q, i) => [q.id, s.answers[i]])) };
    },
    async api(method, fullUrl, body) {
      const [url, search] = fullUrl.split('?');
      currentQuery = new URLSearchParams(search ?? '');
      for (const [m, re, fn] of routes) {
        const match = m === method && re.exec(url);
        if (match) {
          // Round trip through JSON so the page cannot depend on shared object references.
          return JSON.parse(JSON.stringify(fn(...match.slice(1), body)));
        }
      }
      return fail(404, 'Not available in this demo.');
    },
    bar(go, render) {
      const view = (key, label, path) => h('button', {
        type: 'button', class: persona === key ? 'on' : null, 'aria-pressed': String(persona === key),
        onclick: () => { persona = key; go(path); },
      }, label);
      return h('div', { class: 'demo-bar' }, h('div', { class: 'demo-in' },
        h('strong', null, window.__sealedBrand?.notice ?? 'Demo with fictional data. View as:'),
        view('applicant', 'Applicant', '/apply/investment-analyst'),
        view('reviewer', 'Reviewer', '/dashboard'),
        view('lead', 'Hiring lead', '/dashboard'),
        view('master', 'Master', '/dashboard'),
        h('button', {
          type: 'button', class: 'reset',
          onclick: () => {
            try { localStorage.clear(); } catch { /* Nothing to clear. */ }
            reset();
            applyBrand(window.__sealedDemo.brand());
            go('/apply/investment-analyst');
            render();
          },
        }, 'Start over')));
    },
  };
})();

<script>
'use strict';
// Every value is rendered through text nodes, never as HTML, so applicant text cannot inject markup.

const DEMO = window.__sealedDemo ?? null;
const SCORE_LABELS = ['No evidence', 'Limited', 'Solid', 'Strong', 'Exceptional'];
const STATUS_LABELS = { submitted: 'Awaiting decision', advanced: 'Advanced', declined: 'Declined' };
const ROLE_LABELS = { draft: 'Draft', open: 'Open', closed: 'Closed' };

const state = { user: null, org: '', brand: null, trail: [], path: DEMO ? DEMO.start : location.pathname };
const root = document.getElementById('app');
let reviewSteps = 0; // How many answers back a reviewer has stepped.
let keyHandler = null;
const STANDARD_STAGES = [

  { name: 'Team interview', type: 'interview', prompt: 'Meet the people you would work with.', stall_days: 5 },

];
const STAGE_TYPE_LABELS = { task: 'Work task', interview: 'Interview', references: 'References', offer: 'Offer', hired: 'Hired' };
const ROLE_TEMPLATES = [
  {
    name: 'Analyst',
    title: 'Investment Analyst',

      { prompt: 'Tell us about something you built or organised from scratch.', guidance: 'What you personally did, what changed, and what you learned.', word_limit: 250, weight: 1, min_words: 40 },
    ],
  },
  {
    name: 'Community',
    title: 'Community Lead',
    summary: 'Run the programs and events that connect founders.',
    must_haves: ['Do you have the right to work in Australia?'],
    questions: [
      { prompt: 'Describe an event or program you ran. What would you change next time?', guidance: 'Ownership, specifics and real reflection.', word_limit: 250, weight: 2, min_words: 40 },
      { prompt: 'How would you find out what 50 busy founders need most?', guidance: 'A practical method that works with busy people.', word_limit: 250, weight: 1, min_words: 30 },
    ],
  },

    ],
  },
];

async function api(method, url, body) {
  if (DEMO) return DEMO.api(method, url, body);
  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
    credentials: 'same-origin',
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error ?? 'Something went wrong. Please try again.');
    err.status = res.status;
    throw err;
  }
  return data;
}

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props ?? {})) {
    if (value == null || value === false) continue;
    if (key === 'class') el.className = value;
    else if (key === 'style') el.style.cssText = value; // A style attribute would be blocked by the security policy.
    else if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
    else if (key === 'value') el.value = value;
    else if (key === 'checked' || key === 'disabled' || key === 'required') el[key] = Boolean(value);
    else el.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat(Infinity)) {
    if (child == null || child === false) continue;
    el.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return el;
}

// Where Back goes if someone arrived directly, such as from a link in an email.
function parentOf(path) {
  const inner = /^(\/roles\/[^/]+)\/(?:a\/[^/]+|pipeline|review|edit)$/.exec(path);
  if (inner) return inner[1];
  if (/^\/(?:roles\/[^/]+|team|emails|activity|settings|account)$/.test(path)) return '/dashboard';
  if (/^\/(?:apply\/[^/]+|privacy|login)$/.test(path)) return '/';
  return null;
}

function goBack() {
  const previous = state.trail.pop();
  if (previous && !DEMO) { history.back(); return; }
  const target = previous ?? parentOf(state.path);
  if (!target) return;
  state.path = target;
  reviewSteps = 0;
  if (!DEMO) history.replaceState({}, '', target);
  window.scrollTo(0, 0);
  render();
}

function go(path, { replace = false, fresh = false } = {}) {
  stageSetupOpen = false;
  if (fresh) state.trail = [];
  else if (!replace && path !== state.path) state.trail.push(state.path);
  state.path = path;
  reviewSteps = 0;
  if (!DEMO) history[replace ? 'replaceState' : 'pushState']({}, '', path);
  window.scrollTo(0, 0);
  render();
}
window.addEventListener('popstate', () => {
  // The browser's own Back and Forward stay in step with the page's Back button.
  if (state.trail[state.trail.length - 1] === location.pathname) state.trail.pop();
  state.path = location.pathname;
  reviewSteps = 0;
  render();
});

function toast(message) {
  document.querySelector('.toast')?.remove();
  const el = h('div', { class: 'toast', role: 'status' }, message);
  document.body.append(el);
  setTimeout(() => el.remove(), 3500);
}

const fmtDate = (ms) => new Date(ms).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
const fmtDateTime = (ms) => new Date(ms).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const wordCount = (s) => (s.trim() ? s.trim().split(/\s+/).length : 0);
const toLocalInput = (ms) => {
  const d = new Date(ms - new Date(ms).getTimezoneOffset() * 60_000);
  return d.toISOString().slice(0, 16);
};
const store = {
  get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* Drafts are a convenience only. */ } },
  del(key) { try { localStorage.removeItem(key); } catch { /* Drafts are a convenience only. */ } },
};

// Turns "[name removed]" markers into solid redaction bars.
function redacted(text) {
  const parts = String(text).split(/(\[(?:name|email|phone|link|handle|detail) removed\])/g);
  return parts.map((part) => {
    const m = /^\[(\w+) removed\]$/.exec(part);
    return m ? h('span', { class: 'bar', title: `${m[1]} removed` }, `${m[1]} removed`) : part;
  });
}

function errorBox() {
  const box = h('div', { class: 'error', role: 'alert', hidden: true });
  box.show = (msg) => { box.textContent = msg; box.hidden = false; box.scrollIntoView({ block: 'nearest' }); };
  box.clear = () => { box.hidden = true; };
  return box;
}

// Runs an action with its button disabled, showing failures in the given box.
function action(button, box, fn) {
  return async (event) => {
    event?.preventDefault();
    box?.clear();
    if (button) button.disabled = true;
    try {
      await fn();
    } catch (err) {
      if (box) box.show(err.message); else toast(err.message);
    } finally {
      if (button) button.disabled = false;
    }
  };
}

function applyBrand(brand) {
  state.brand = brand;
  const root = document.documentElement.style;
  const readableOn = (hex) => {
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
    // Whichever of near-black or white has the stronger contrast on this colour.
    return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.179 ? '#16120c' : '#ffffff';
  };
  for (const [name, value] of [['accent', brand?.accent], ['secondary', brand?.secondary], ['hero-bg', brand?.hero]]) {
    if (value) {
      root.setProperty(`--${name}`, value);
      root.setProperty(`--on-${name}`, readableOn(value));
    } else {
      root.removeProperty(`--${name}`);
      root.removeProperty(`--on-${name}`);
    }
  }
  if (brand?.name) document.title = brand.name;

  const custom = brand?.font && brand.font !== 'Geist';
  if (custom) {
    let link = document.getElementById('brand-font');
    if (!link) {
      link = document.createElement('link');
      link.id = 'brand-font';
      link.rel = 'stylesheet';
      document.head.append(link);
    }
    link.href = `https://fonts.googleapis.com/css2?family=${brand.font.replace(/ /g, '+')}:wght@400;500;600&display=swap`;
    root.setProperty('--sans', `"${brand.font}", "Helvetica Neue", Arial, sans-serif`);
  } else {
    root.removeProperty('--sans');
  }
  if (brand?.icon) {
    let icon = document.querySelector('link[rel="icon"]');
    if (!icon) {
      icon = document.createElement('link');
      icon.rel = 'icon';
      document.head.append(icon);
    }
    icon.href = brand.icon;
  }
}

function brandMark() {
  const b = state.brand;
  if (b?.logo) return h('img', { class: 'logo', src: b.logo, alt: b.name ?? 'Home' });
  return b?.name ?? 'Sealed';
}

function shell(children, { narrow = false, hero = null } = {}) {
  const u = state.user;
  const here = state.path;
  const link = (label, path, on) => h('button', { type: 'button', class: on ? 'on' : null, onclick: () => go(path) }, label);
  const nav = u ? [
    link('Roles', '/dashboard', here === '/dashboard' || here.startsWith('/roles')),
    u.master && link('Team', '/team', here === '/team'),
    u.master && link('Emails', '/emails', here === '/emails'),
    u.master && link('Activity', '/activity', here === '/activity'),
    u.master && link('Settings', '/settings', here === '/settings'),
    !DEMO && link('Account', '/account', here === '/account'),

  return [
    DEMO && DEMO.bar((path) => go(path, { fresh: true }), render),

      h('button', { type: 'button', class: 'brand', onclick: () => go(u ? '/dashboard' : '/') }, brandMark()),
      h('nav', { class: 'nav', 'aria-label': 'Main' }, nav),
      u && !DEMO && h('button', {
        type: 'button', class: 'signout',
        onclick: async () => { await api('POST', '/api/logout', {}); state.user = null; go('/login', { fresh: true }); },
      }, 'Sign out'),
    )),
    hero && h('section', { class: `hero${state.brand?.header === 'dark' ? ' dark' : ''}` },
      h('div', { class: `hero-in${narrow ? ' narrow' : ''}` }, h('i', { class: 'hero-mark' }), hero)),
    h('main', { class: `page${narrow ? ' narrow' : ''}` },
      (state.trail.length > 0 || parentOf(state.path)) && h('div', null, h('button', { type: 'button', class: 'back', onclick: goBack },
        h('span', { 'aria-hidden': 'true' }, '\u2190'), 'Back')),
      children),
  ];
}

const paint = (nodes) => { root.replaceChildren(...nodes.flat(Infinity).filter(Boolean)); };

const closeLabel = (r) => (r.status === 'closed' ? 'Applications closed' : `Closes ${fmtDate(r.closes_at)}`);
function pill(kind, label) { return h('span', { class: `pill ${kind}` }, label); }

// ---- Public: list of open roles ----
async function viewHome() {
  const data = await api('GET', '/api/public/roles');
  return shell([
    h('div', null, data.roles.length
      ? data.roles.map((r) => h('div', { class: 'role-row' },

  ], {

  });
}

// ---- Public: application flow ----
async function viewApply(slug) {
  const data = await api('GET', `/api/public/roles/${encodeURIComponent(slug)}`);
  const { role, questions } = data;
  if (!role.open) {
    return shell([h('h1', null, role.title), h('div', null, h('p', null, `Applications for this role closed on ${fmtDate(role.closes_at)}.`))], { narrow: true });
  }

  const draftKey = `sealed-draft-${slug}`;
  const sample = DEMO?.sampleFor?.(slug, questions);
  const form = {
    answers: store.get(draftKey) ?? sample?.answers ?? {},
    contact: sample?.contact ?? { first_name: '', last_name: '', email: '', phone: '', linkedin: '' },
    consent: false,
    website: '',
    must_haves: sample?.must_haves ?? data.must_haves.map(() => null),
  };
  const draftToken = DEMO ? null : new URLSearchParams(location.search).get('draft');
  let resumed = false;
  if (draftToken) {
    try {
      const saved = await api('GET', `/api/public/roles/${encodeURIComponent(slug)}/draft/${encodeURIComponent(draftToken)}`);
      form.answers = saved.answers ?? {};
      form.contact = { ...form.contact, ...saved.contact };
      if (Array.isArray(saved.must_haves) && saved.must_haves.length) form.must_haves = saved.must_haves;
      resumed = true;
    } catch (err) {
      toast(err.message);
    }
  }
  let step = 0;
  let preview = null;

  function saveLater() {
    const area = h('div', { class: 'stack' });
    const box = errorBox();
    const open = () => {
      const email = h('input', { id: 'later-email', type: 'email', autocomplete: 'email', value: form.contact.email ?? '' });
      const send = h('button', { class: 'btn', type: 'button' }, 'Email me a link');
      send.addEventListener('click', action(send, box, async () => {
        const res = await api('POST', `/api/public/roles/${encodeURIComponent(slug)}/draft`, {
          email: email.value, answers: form.answers, must_haves: form.must_haves, contact: form.contact,
        });
        area.replaceChildren(h('div', { class: 'notice stack' },
          h('strong', null, 'Saved'),
          h('span', null, 'Use this link to continue on any device.'),
          h('span', { class: 'code wrap' }, DEMO ? 'your-domain.example/apply/one-time-link' : `${location.origin}${res.resume_path}`)));
      }));
      area.replaceChildren(h('label', { class: 'field', for: 'later-email' }, 'Your email', email), box, h('div', { class: 'row' }, send));
    };
    area.append(h('div', null, h('button', { class: 'quiet', type: 'button', onclick: open }, 'Save and finish later')));
    return area;
  }
  const main = h('div', { class: 'stack lg' });

  const stepper = () => h('ol', { class: 'steps', 'aria-label': 'Application steps' },
    ['Answers', 'Details', 'Submit'].map((label, i) =>
      h('li', { class: i === step ? 'on' : i < step ? 'done' : null, 'aria-current': i === step ? 'step' : null }, label)));

  function setStep(n) {
    step = n;
    draw();
    window.scrollTo(0, 0);
  }

  function drawAnswers() {
    const box = errorBox();
    const requirements = data.must_haves.map((m, i) => {
      const choice = (label, value) => h('label', { class: 'choice', for: `must-${i}-${value}` },
        h('input', {
          id: `must-${i}-${value}`, type: 'radio', name: `must-${i}`, checked: form.must_haves[i] === value,
          onchange: () => { form.must_haves[i] = value; },
        }), label);
      return h('fieldset', { class: 'must' }, h('legend', null, m), h('div', { class: 'row' }, choice('Yes', true), choice('No', false)));
    });
    const fields = questions.map((q, i) => {
      const counter = h('span', { class: 'hint num' });
      const update = (value) => {
        const n = wordCount(value);
        counter.textContent = q.min_words ? `${n} words · ${q.min_words} to ${q.word_limit}` : `${n} of ${q.word_limit} words`;
        counter.className = n > q.word_limit ? 'over num small' : 'hint num';
      };
      const area = h('textarea', {
        id: `answer-${i}`, value: form.answers[q.id] ?? '',
        oninput: (e) => { form.answers[q.id] = e.target.value; update(e.target.value); store.set(draftKey, form.answers); },
      });
      update(form.answers[q.id] ?? '');
      return h('label', { class: 'field', for: `answer-${i}` },
        h('span', null, `${i + 1}. ${q.prompt}`),
        q.guidance && h('span', { class: 'hint' }, q.guidance),
        area, counter);
    });
    const next = h('button', { class: 'btn primary', type: 'submit' }, 'Next: contact details');
    return h('form', {
      class: 'stack lg', novalidate: true,
      onsubmit: (e) => {
        e.preventDefault();
        box.clear();
        for (const q of questions) {
          const n = wordCount(form.answers[q.id] ?? '');
          if (!n) return box.show(`Please answer "${q.prompt}"`);
          if (n > q.word_limit) return box.show(`Your answer to "${q.prompt}" is over the ${q.word_limit} word limit.`);
          if (n < q.min_words) return box.show(`Your answer to "${q.prompt}" needs at least ${q.min_words} words.`);
        }
        if (form.must_haves.some((v) => v === null)) return box.show('Please answer every yes or no question.');
        return setStep(1);
      },
    },
    h('p', { class: 'lede' }, 'No CV. Your answers are read without your name.'),
    requirements.length > 0 && h('div', { class: 'stack' }, requirements),
    h('div', { class: 'stack lg' }, fields),
    box, h('div', { class: 'row' }, next), saveLater());
  }

  function drawContact() {
    const box = errorBox();
    const c = form.contact;
    const field = (key, label, type, hint, auto) => h('label', { class: 'field', for: `contact-${key}` },
      h('span', null, label), hint && h('span', { class: 'hint' }, hint),
      h('input', { id: `contact-${key}`, type, value: c[key] ?? '', autocomplete: auto, oninput: (e) => { c[key] = e.target.value; } }));
    const next = h('button', { class: 'btn primary', type: 'submit' }, 'Next: check what reviewers will see');
    const submit = action(next, box, async () => {
      if (!c.first_name.trim() || !c.last_name.trim()) throw new Error('Please enter your first and last name, so we can contact you if you move forward.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email.trim())) throw new Error('Please enter a valid email address.');
      preview = await api('POST', `/api/public/roles/${encodeURIComponent(slug)}/preview`, { answers: form.answers, contact: c });
      setStep(2);
    });
    return h('form', { class: 'stack lg', novalidate: true, onsubmit: submit },
      h('p', { class: 'lede' }, 'Sealed and stored apart from your answers. Opened only if you move forward.'),
      h('div', { class: 'stack' },
        h('div', { class: 'two' }, field('first_name', 'First name', 'text', null, 'given-name'), field('last_name', 'Last name', 'text', null, 'family-name')),
        field('email', 'Email', 'email', 'We send your confirmation and outcome here.', 'email'),
        h('div', { class: 'two' }, field('phone', 'Phone (optional)', 'tel', null, 'tel'), field('linkedin', 'LinkedIn (optional)', 'text', null, 'url'))),
      box,
      h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: () => setStep(0) }, 'Back'), next), saveLater());
  }

  function drawReview() {
    const box = errorBox();
    const removed = Object.values(preview.answers).reduce((n, a) => n + a.found.length, 0);
    const hints = [...new Set(Object.values(preview.answers).flatMap((a) => a.hints))];
    const submit = h('button', { class: 'btn primary', type: 'button' }, 'Submit application');
    submit.addEventListener('click', action(submit, box, async () => {
      if (!form.consent) throw new Error('Please tick the box to confirm how your details are handled.');
      const res = await api('POST', `/api/public/roles/${encodeURIComponent(slug)}/apply`, {
        answers: form.answers, contact: form.contact, consent: true, website: form.website, must_haves: form.must_haves, draft: draftToken,
      });
      store.del(draftKey);
      state.justSubmitted = true;
      if (res.status_path) go(res.status_path, { fresh: true }); else go('/', { fresh: true });
    }));
    return h('div', { class: 'stack lg' },
      removed > 0 && h('p', { class: 'lede' }, `We removed ${removed} identifying ${removed === 1 ? 'detail' : 'details'}. Go back if that changes your meaning.`),
      hints.map((hint) => h('p', { class: 'muted small' }, hint)),
      h('div', { class: 'two' },
        h('section', { class: 'stack' },
          h('div', { class: 'eyebrow' }, 'What reviewers see'),
          questions.map((q) => h('div', { class: 'stack' }, h('h3', null, q.prompt), h('p', { class: 'pre' }, redacted(preview.answers[q.id].text))))),
        h('section', { class: 'stack panel' },
          h('div', { class: 'eyebrow' }, 'Sealed'),
          h('dl', { class: 'kv' },
            h('dt', null, 'Name'), h('dd', null, `${form.contact.first_name} ${form.contact.last_name}`),
            h('dt', null, 'Email'), h('dd', null, form.contact.email),
            form.contact.phone && [h('dt', null, 'Phone'), h('dd', null, form.contact.phone)],
            form.contact.linkedin && [h('dt', null, 'LinkedIn'), h('dd', null, form.contact.linkedin)]),
          h('p', { class: 'small muted' }, `If you do not move forward, nobody opens these. They are deleted after ${data.retention_days} days.`))),
      h('input', { class: 'hp', type: 'text', tabindex: '-1', autocomplete: 'off', 'aria-hidden': 'true', id: 'website', oninput: (e) => { form.website = e.target.value; } }),
      h('label', { class: 'check', for: 'consent' },
        h('input', { id: 'consent', type: 'checkbox', onchange: (e) => { form.consent = e.target.checked; } }),
        h('span', null, `I agree to ${data.org} storing my answers and contact details for this application. I can withdraw and delete them at any time.`,
          data.scan_enabled && ' An automated check, which includes an AI service, first reads my answers with my details removed. People make every decision.')),
      h('div', null, h('button', {
        class: 'quiet', type: 'button',
        onclick: async (e) => {
          const notice = await api('GET', '/api/public/privacy');
          e.target.replaceWith(h('div', { class: 'panel pre small' }, notice.text));
        },
      }, 'Read the privacy notice')),
      box,
      h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: () => setStep(1) }, 'Back'), submit));
  }

  function draw() {
    main.replaceChildren(...[stepper(), resumed && step === 0 && h('p', { class: 'notice' }, 'Welcome back. Your saved answers are below.'), [drawAnswers, drawContact, drawReview][step]()].filter(Boolean));
  }
  draw();

  return shell([main], {
    narrow: true,
    hero: [
      h('div', { class: 'eyebrow' }, `Closes ${fmtDate(role.closes_at)}`),
      h('h1', null, role.title),
      role.description && h('p', { class: 'lede pre' }, role.description),
    ],
  });
}

// ---- Public: status page ----
async function viewStatus(token) {
  const s = await api('GET', `/api/public/status/${encodeURIComponent(token)}`);
  const justSent = state.justSubmitted;
  state.justSubmitted = false;
  const copy = {
    received: [justSent ? 'Application sent' : 'Application received', `Reviewers start after applications close on ${fmtDate(s.closes_at)}.`],
    in_review: ['Being reviewed', 'Your answers are being read without your name. We will email you when there is an outcome.'],
    advanced: ['You are moving forward', 'Your answers scored highly and the team will contact you shortly. Your contact details were opened only after this decision.'],
    declined: ['Not moving forward this time', s.contact_deleted
      ? 'This decision was made without anyone seeing your name or contact details. Those details have now been deleted.'
      : `This decision was made without anyone seeing your name or contact details. They will be deleted automatically within ${s.retention_days} days.`],
    withdrawn: ['Application withdrawn', 'Your answers and contact details have been deleted.'],
  }[s.state];

  const stage = s.stage;
  if (stage && s.state === 'advanced') {
    const titles = { task: stage.anonymous ? 'A short task, still anonymous' : 'A short task', interview: `Time to meet: ${stage.name}`, references: 'One last check', offer: 'We would like to make you an offer', hired: 'Welcome aboard' };
    const notes = {
      task: stage.anonymous ? 'Your answers stood out. You stay anonymous for this step, so your name is still sealed.' : 'Your next step is below.',
      interview: 'The team can now see your name. Book a time that suits you.',
      references: 'Please share your referees below.',
      offer: 'Someone from the team will be in touch to talk it through.',
      hired: 'We are thrilled you are joining.',
    };
    copy[0] = titles[stage.type];
    copy[1] = notes[stage.type];
  }
  if (s.state === 'declined' && s.opened) copy[1] = 'Thank you for the time you put in. We have decided not to continue with your application.';

  const later = s.journey ?? [];
  const reached = s.state === 'advanced' ? (stage ? stage.index + 3 : 3) : ({ received: 1, in_review: 2, declined: 2 }[s.state] ?? 0);
  const steps = later.length
    ? [['Received', fmtDate(s.submitted_at)], ['Read without your name', ''], ...later.map((n) => [n, ''])]
    : [['Received', fmtDate(s.submitted_at)], ['Being read, without your name', reached >= 2 ? '' : `From ${fmtDate(s.closes_at)}`], ['Outcome', s.state === 'advanced' ? 'Moving forward' : s.state === 'declined' ? 'Not this time' : '']];
  const timeline = s.state !== 'withdrawn' && h('ol', { class: 'timeline' }, steps.map(([label, note], i) => h('li', { class: i < reached ? 'done' : null, 'aria-current': i === reached - 1 ? 'step' : null },
    h('span', null, label), note && h('span', { class: 'hint' }, note))));

  let stagePanel = null;
  if (stage && s.state === 'advanced') {
    if (['task', 'references'].includes(stage.type)) {
      const area = h('textarea', { id: 'stage-work' });
      const workBox = errorBox();
      const send = h('button', { class: 'btn primary' }, stage.submitted_at ? 'Send an updated version' : 'Send');
      send.addEventListener('click', action(send, workBox, async () => {
        await api('POST', `/api/public/status/${encodeURIComponent(token)}/work`, { text: area.value });
        toast('Sent');
        render();
      }));
      stagePanel = h('section', { class: 'stack panel' },
        h('h2', null, stage.name),
        stage.prompt && h('p', { class: 'pre' }, stage.prompt),
        stage.due_at && h('p', { class: 'hint' }, `Due ${fmtDate(stage.due_at)}`),
        stage.submitted_at && h('p', { class: 'hint' }, `Received ${fmtDate(stage.submitted_at)}. You can send an update until you move to the next step.`),
        stage.anonymous && h('p', { class: 'hint' }, 'Any name or contact details you include are removed before anyone reads it.'),
        h('label', { class: 'field', for: 'stage-work' }, 'Your response', area),
        workBox, h('div', { class: 'row' }, send));
    } else if (stage.type === 'interview') {
      stagePanel = h('section', { class: 'stack panel' },
        h('h2', null, stage.name),
        stage.prompt && h('p', { class: 'pre' }, stage.prompt),
        stage.booking_url ? h('div', { class: 'row' }, h('a', { class: 'btn primary', href: stage.booking_url, target: '_blank', rel: 'noopener' }, 'Book a time')) : h('p', { class: 'hint' }, 'The team will contact you to find a time.'));
    }
  }

  const box = errorBox();
  let confirming = false;
  const withdrawArea = h('div', { class: 'stack' });
  const drawWithdraw = () => {
    if (!s.can_withdraw) return withdrawArea.replaceChildren();
    if (!confirming) {
      return withdrawArea.replaceChildren(h('div', null, h('button', { class: 'quiet', onclick: () => { confirming = true; drawWithdraw(); } }, 'Withdraw my application')));
    }
    const yes = h('button', { class: 'btn danger' }, 'Yes, withdraw and delete');
    yes.addEventListener('click', action(yes, box, async () => {
      await api('POST', `/api/public/status/${encodeURIComponent(token)}/withdraw`, {});
      render();
    }));
    return withdrawArea.replaceChildren(
      h('p', null, 'This permanently deletes your answers and contact details.'),
      h('div', { class: 'row' }, yes, h('button', { class: 'btn', onclick: () => { confirming = false; drawWithdraw(); } }, 'Keep my application')),
    );
  };
  drawWithdraw();
  const pageLink = DEMO ? null : location.href;
  return shell([
    stagePanel,
    timeline,
    s.state === 'received' && pageLink && h('div', { class: 'row' },
      h('button', { class: 'btn', onclick: async () => {
        try { await navigator.clipboard.writeText(pageLink); toast('Link copied'); } catch { toast('Select the address bar to copy the link'); }
      } }, 'Copy this page\u2019s link'),
      h('span', { class: 'hint' }, 'We also email it to you.')),
    box, withdrawArea,
  ].filter(Boolean), {
    narrow: true,
    hero: [
      h('div', { class: 'eyebrow' }, `${s.role} · `, h('span', { class: 'code' }, s.code)),
      h('h1', null, copy[0]),
      h('p', { class: 'lede' }, copy[1]),
    ],
  });
}

// ---- Sign in ----
function viewLogin() {
  const box = errorBox();
  const email = h('input', { id: 'login-email', type: 'email', autocomplete: 'username' });
  const password = h('input', { id: 'login-password', type: 'password', autocomplete: 'current-password' });
  const code = h('input', { id: 'login-code', type: 'text', inputmode: 'numeric', autocomplete: 'one-time-code' });
  const codeField = h('label', { class: 'field', for: 'login-code', hidden: true }, 'Code from your authenticator app',
    h('span', { class: 'hint' }, 'Or use one of your recovery codes.'), code);
  const submit = h('button', { class: 'btn primary', type: 'submit' }, 'Sign in');
  const forgotArea = h('div', null);
  forgotArea.append(h('button', {
    class: 'quiet', type: 'button',
    onclick: async () => {
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) { box.show('Enter your email above first.'); return; }
      box.clear();
      try {
        await api('POST', '/api/forgot', { email: email.value });
        forgotArea.replaceChildren(h('p', { class: 'muted small' }, 'If that email has an account, a reset link is on its way. A hiring lead can also reset it for you under Team.'));
      } catch (err) { box.show(err.message); }
    },
  }, 'Forgot password?'));
  return shell([
    h('h1', null, 'Sign in'),
    h('form', {
      class: 'stack',
      onsubmit: action(submit, box, async () => {
        const res = await api('POST', '/api/login', { email: email.value, password: password.value, code: code.value || undefined });
        if (res.needs_code) {
          codeField.hidden = false;
          code.focus();
          return;
        }
        state.user = res.user;
        go('/dashboard', { fresh: true });
      }),
    },
    h('label', { class: 'field', for: 'login-email' }, 'Email', email),
    h('label', { class: 'field', for: 'login-password' }, 'Password', password),
    codeField,
    box, h('div', { class: 'row' }, submit), forgotArea),
  ], { narrow: true });
}
