// ---- Dashboard ----
async function viewDashboard() {
  const { roles } = await api('GET', '/api/roles');
  const isAdmin = state.user.role === 'admin';
  const setup = state.user.master ? await api('GET', '/api/setup') : null;
  const doneCount = setup?.steps.filter((x) => x.done).length ?? 0;
  const copyRole = (r) => h('button', {
    class: 'quiet',
    onclick: async () => {
      try {
        const made = await api('POST', `/api/roles/${r.id}/duplicate`, {});
        toast('Copied as a draft');
        go(`/roles/${made.id}/edit`);
      } catch (err) { toast(err.message); }
    },
  }, 'Duplicate');
  const roleRow = (r) => {
    const left = r.mine ? r.mine.total - r.mine.scored : 0;
    return h('div', { class: 'role-row' },
      h('div', { class: 'row between' },
        h('div', { class: 'row' }, h('h2', null, r.title), pill(r.status, ROLE_LABELS[r.status])),
        h('div', { class: 'row' },
          left > 0 && h('button', { class: 'btn primary', onclick: () => go(`/roles/${r.id}/review`) }, `Score ${left} ${left === 1 ? 'answer' : 'answers'}`),
          r.status !== 'draft' && h('button', { class: 'btn', onclick: () => go(`/roles/${r.id}`) }, 'Ranking'),
          (r.can_manage || (r.status !== 'draft' && r.has_pipeline)) && h('button', { class: 'btn', onclick: () => go(`/roles/${r.id}/pipeline`) }, 'Pipeline'),
          r.can_manage && h('button', { class: 'quiet', onclick: () => go(`/roles/${r.id}/edit`) }, 'Edit'),
          r.can_manage && copyRole(r))),
      h('p', { class: 'muted small' },
        `${r.applications} ${r.applications === 1 ? 'application' : 'applications'}`,
        r.area ? ` · ${r.area}` : '',
        r.set_aside ? ` · ${r.set_aside} set aside` : '',
        ` · ${closeLabel(r)}`,
        r.reviewers.length ? '' : ' · No reviewers assigned'));
  };
  return shell([
    h('div', { class: 'row between' }, h('h1', null, 'Roles'),
      isAdmin && h('button', { class: 'btn primary', onclick: () => go('/roles/new') }, 'New role')),
    setup && doneCount < setup.steps.length && h('section', { class: 'stack panel' },
      h('div', { class: 'row between' }, h('h2', null, 'Get set up'), h('span', { class: 'hint num' }, `${doneCount} of ${setup.steps.length}`)),
      h('div', { class: 'meter' }, h('i', { style: `width:${(doneCount / setup.steps.length) * 100}%` })),
      h('ol', { class: 'setup' }, setup.steps.map((x) => h('li', { class: x.done ? 'done' : null },
        h('span', { class: 'grow' }, x.label),
        x.done ? h('span', { class: 'hint' }, 'Done') : h('button', { class: 'quiet', onclick: () => go(x.path) }, x.action))))),
    h('div', null, roles.length ? roles.map(roleRow)
      : h('p', { class: 'muted' }, isAdmin ? 'Create your first role to get an application link.' : 'No roles are assigned to you yet.')),
  ]);
}

// ---- Role editor ----
async function viewRoleEdit(id) {
  const { users, areas } = await api('GET', '/api/users');
  const existing = id ? await api('GET', `/api/roles/${id}`) : null;
  const locked = existing?.questions_locked;
  const form = existing ? {
    title: existing.role.title, summary: existing.role.summary, description: existing.role.description,
    closes_at: existing.role.closes_at, reviewer_ids: existing.reviewer_ids,
    must_haves: existing.role.must_haves, scan_enabled: existing.role.scan_enabled, sample_percent: existing.role.sample_percent,
    area: existing.role.area, reviews_per: existing.role.reviews_per, lead_ids: existing.lead_ids, scan_rules: existing.role.scan_rules,
    questions: existing.questions.map((q) => ({ prompt: q.prompt, guidance: q.guidance, word_limit: q.word_limit, weight: q.weight, min_words: q.min_words, screened: Boolean(q.screened) })),
  } : {
    title: '', summary: '', description: '', closes_at: Date.now() + 21 * 86_400_000, reviewer_ids: [],
    stages: STANDARD_STAGES.map((x) => ({ ...x })), must_haves: [], scan_enabled: true, sample_percent: 10, area: '', reviews_per: 0,
    lead_ids: state.user.master ? [] : [state.user.id],
    scan_rules: { repeat_question: true, same_answer: true, low_variety: true, near_copy: true, ai: true, ai_bar: 'low', extra_check: '' },
    questions: [{ prompt: '', guidance: '', word_limit: 250, weight: 1, min_words: 30, screened: true }],
  };
  if (!existing && state.roleTemplate) {
    const tpl = state.roleTemplate;
    Object.assign(form, { title: tpl.title, summary: tpl.summary, must_haves: [...tpl.must_haves], questions: tpl.questions.map((q) => ({ ...q })) });
    state.roleTemplate = null;
  }
  const box = errorBox();
  const questionArea = h('div', { class: 'stack' });

  function drawQuestions() {
    questionArea.replaceChildren(...form.questions.map((q, i) => h('div', { class: 'qcard' },
      h('label', { class: 'field', for: `q-prompt-${i}` }, `Question ${i + 1}`,
        h('textarea', { id: `q-prompt-${i}`, style: 'min-height:70px', disabled: locked, value: q.prompt, oninput: (e) => { q.prompt = e.target.value; } })),
      h('label', { class: 'field', for: `q-guide-${i}` }, 'What a strong answer shows',
        h('input', { id: `q-guide-${i}`, type: 'text', disabled: locked, value: q.guidance, oninput: (e) => { q.guidance = e.target.value; } })),
      h('div', { class: 'qgrid' },
        h('label', { class: 'field', for: `q-min-${i}` }, 'Minimum words', h('input', { id: `q-min-${i}`, type: 'number', min: '0', max: '500', disabled: locked, value: q.min_words, oninput: (e) => { q.min_words = Number(e.target.value); } })),
        h('label', { class: 'field', for: `q-limit-${i}` }, 'Word limit', h('input', { id: `q-limit-${i}`, type: 'number', min: '10', max: '2000', disabled: locked, value: q.word_limit, oninput: (e) => { q.word_limit = Number(e.target.value); } })),
        h('label', { class: 'field', for: `q-weight-${i}` }, 'Weight (1 to 5)', h('input', { id: `q-weight-${i}`, type: 'number', min: '1', max: '5', disabled: locked, value: q.weight, oninput: (e) => { q.weight = Number(e.target.value); } }))),
      h('label', { class: 'check', for: `q-screen-${i}` },
        h('input', { id: `q-screen-${i}`, type: 'checkbox', checked: q.screened !== false, onchange: (e) => { q.screened = e.target.checked; } }),
        h('span', null, 'Include in the first scan')),
      !locked && form.questions.length > 1 && h('div', null, h('button', { type: 'button', class: 'quiet', onclick: () => { form.questions.splice(i, 1); drawQuestions(); } }, 'Remove question')))));
  }
  drawQuestions();

  const ruleSwitch = (key, label, hint) => h('label', { class: 'check', for: `rule-${key}` },
    h('input', { id: `rule-${key}`, type: 'checkbox', checked: form.scan_rules[key] !== false, onchange: (e) => { form.scan_rules[key] = e.target.checked; } }),
    h('span', null, label, h('span', { class: 'hint block' }, hint)));
  const screenArea = h('div', { class: 'stack', hidden: !form.scan_enabled },
    h('div', { class: 'stack' },
      ruleSwitch('ai', 'AI check of each answer', existing && !existing.ai_available ? 'Not connected yet, so this check is skipped.' : 'Reads answers with names removed and flags those that miss the bar.'),
      ruleSwitch('repeat_question', 'Repeats the question', 'The answer just restates what was asked.'),
      ruleSwitch('same_answer', 'Same answer twice', 'The same text is used for two questions.'),
      ruleSwitch('low_variety', 'Mostly repeated words', 'Filler or padding to reach a word count.'),
      ruleSwitch('near_copy', 'Copy of another application', 'Nearly identical to someone who applied earlier.')),
    h('label', { class: 'field', for: 'rule-bar' }, 'How firm the AI check is',
      h('select', { id: 'rule-bar', onchange: (e) => { form.scan_rules.ai_bar = e.target.value; } },
        h('option', { value: 'low', selected: form.scan_rules.ai_bar !== 'firm' }, 'Only off-topic or non-answers (recommended)'),
        h('option', { value: 'firm', selected: form.scan_rules.ai_bar === 'firm' }, 'Also answers with nothing specific'))),
    h('label', { class: 'field', for: 'rule-extra' }, 'Also check for (optional)',
      h('span', { class: 'hint' }, 'For example, "Mentions a project they worked on". Keep it about the work, not the person.'),
      h('input', { id: 'rule-extra', type: 'text', maxlength: '300', value: form.scan_rules.extra_check ?? '', oninput: (e) => { form.scan_rules.extra_check = e.target.value; } })),
    h('label', { class: 'field', for: 'r-must' }, 'Must-have requirements',
      h('span', { class: 'hint' }, 'One yes or no question per line. Answering no sets an application aside. Use only true requirements.'),
      h('textarea', { id: 'r-must', style: 'min-height:80px', disabled: locked, value: form.must_haves.join('\n'), oninput: (e) => { form.must_haves = e.target.value.split('\n').map((x) => x.trim()).filter(Boolean); } })),
    h('label', { class: 'field', for: 'r-sample' }, 'Spot-check (%)',
      h('span', { class: 'hint' }, 'This share of the set-aside pile still goes to reviewers, as a check on the scan.'),
      h('input', { id: 'r-sample', type: 'number', min: '0', max: '100', style: 'max-width:120px', value: form.sample_percent, oninput: (e) => { form.sample_percent = Number(e.target.value); } })));

  const teamArea = h('div', { class: 'stack' });
  function drawTeam() {
    const person = (u, list, prefix) => h('label', { class: 'check', for: `${prefix}-${u.id}` },
      h('input', {
        id: `${prefix}-${u.id}`, type: 'checkbox', checked: form[list].includes(u.id),
        onchange: (e) => { form[list] = e.target.checked ? [...form[list], u.id] : form[list].filter((x) => x !== u.id); },
      }),
      h('span', null, u.name, u.areas.length > 0 && h('span', { class: 'hint' }, ` · ${u.areas.join(', ')}`)));
    const leads = users.filter((u) => u.role === 'admin' && !u.master);
    teamArea.replaceChildren(
      ...(leads.length ? [h('h3', null, 'Hiring leads'), ...leads.map((u) => person(u, 'lead_ids', 'lead'))] : []),
      h('h3', null, 'Reviewers'),
      ...users.map((u) => person(u, 'reviewer_ids', 'rev')),
    );
  }
  drawTeam();

  const save = h('button', { class: 'btn primary', type: 'submit' }, existing ? 'Save changes' : 'Save as draft');
  const statusButtons = [];
  if (existing) {
    const s = existing.role.status;
    const statusBtn = (label, status, cls) => {
      const b = h('button', { class: `btn ${cls ?? ''}`, type: 'button' }, label);
      b.addEventListener('click', action(b, box, async () => {
        await api('PUT', `/api/roles/${id}`, form);
        await api('POST', `/api/roles/${id}/status`, { status });
        toast(status === 'open' ? 'Role is open. Share the application link.' : 'Role closed. Reviewers have been told.');
        render();
      }));
      return b;
    };
    if (s !== 'open') statusButtons.push(statusBtn(s === 'draft' ? 'Save and open applications' : 'Reopen applications', 'open', 'primary'));
    if (s === 'open') statusButtons.push(statusBtn('Close applications now', 'closed'));
  }
  const link = existing && existing.role.status !== 'draft'
    ? `${location.origin}/apply/${existing.role.slug}` : null;

  return shell([
    h('h1', null, existing ? `Edit ${existing.role.title}` : 'New role'),
    !existing && h('div', { class: 'row' }, h('span', { class: 'hint' }, 'Start from'),
      ROLE_TEMPLATES.map((tpl) => h('button', { class: 'btn', type: 'button', onclick: () => { state.roleTemplate = tpl; render(); } }, tpl.name))),
    link && !DEMO && h('div', { class: 'notice stack' },
      h('strong', null, 'Application link'),
      h('div', { class: 'row' }, h('span', { class: 'code grow', style: 'white-space:normal;overflow-wrap:anywhere' }, link),
        h('button', { class: 'btn', type: 'button', onclick: async () => {
          try { await navigator.clipboard.writeText(link); toast('Link copied'); } catch { toast('Select the link to copy it'); }
        } }, 'Copy'))),
    h('form', {
      class: 'stack lg', novalidate: true,
      onsubmit: action(save, box, async () => {
        if (existing) { await api('PUT', `/api/roles/${id}`, form); toast('Saved'); render(); } else {
          const made = await api('POST', '/api/roles', form);
          go(`/roles/${made.id}/edit`, { replace: true });
        }
      }),
    },
    h('section', { class: 'stack' },
      h('h2', null, 'The role'),
      h('label', { class: 'field', for: 'r-title' }, 'Title', h('input', { id: 'r-title', type: 'text', value: form.title, oninput: (e) => { form.title = e.target.value; } })),
      h('label', { class: 'field', for: 'r-summary' }, 'One line summary', h('input', { id: 'r-summary', type: 'text', value: form.summary, oninput: (e) => { form.summary = e.target.value; } })),
      h('label', { class: 'field', for: 'r-desc' }, 'Description', h('textarea', { id: 'r-desc', value: form.description, oninput: (e) => { form.description = e.target.value; } })),
      h('label', { class: 'field', for: 'r-close' }, 'Applications close',
        h('span', { class: 'hint' }, 'The role closes on its own at this time, and reviewers are told.'),
        h('input', { id: 'r-close', type: 'datetime-local', value: toLocalInput(form.closes_at), oninput: (e) => { const t = Date.parse(e.target.value); if (t) form.closes_at = t; } }))),
    h('section', { class: 'stack' },
      h('h2', null, 'Questions'),
      locked && h('div', { class: 'warn' }, 'Questions are locked because people have already applied. Every applicant must answer the same questions.'),
      questionArea,
      !locked && h('div', null, h('button', { type: 'button', class: 'btn', onclick: () => { form.questions.push({ prompt: '', guidance: '', word_limit: 250, weight: 1, min_words: 30, screened: true }); drawQuestions(); } }, 'Add question'))),
    h('section', { class: 'stack' },
      h('h2', null, 'What gets screened'),
      h('p', { class: 'muted' }, 'Anything these checks flag is set aside with a reason. Nobody is declined automatically.'),
      h('label', { class: 'check', for: 'r-scan' },
        h('input', { id: 'r-scan', type: 'checkbox', checked: form.scan_enabled, onchange: (e) => { form.scan_enabled = e.target.checked; screenArea.hidden = !e.target.checked; } }),
        h('span', null, 'Run the first scan on this job')),
      screenArea,
      locked && h('p', { class: 'muted small' }, 'Changes apply to new applications. To apply them to existing ones, use Run scan again on the ranking page.')),
    h('section', { class: 'stack' },
      h('h2', null, 'Who works on this job'),
      h('label', { class: 'field', for: 'r-area' }, 'Job area',
        h('span', { class: 'hint' }, 'Choosing an area brings in the people who cover it. You can change the list below.'),
        h('select', {
          id: 'r-area',
          onchange: (e) => {
            form.area = e.target.value;
            const inArea = users.filter((u) => !u.master && u.areas.includes(form.area));
            form.reviewer_ids = [...new Set([...form.reviewer_ids, ...inArea.filter((u) => u.role === 'reviewer').map((u) => u.id)])];
            form.lead_ids = [...new Set([...form.lead_ids, ...inArea.filter((u) => u.role === 'admin').map((u) => u.id)])];
            drawTeam();
          },
        },
        h('option', { value: '', selected: !form.area }, 'None'),
        areas.map((a) => h('option', { value: a, selected: form.area === a }, a)))),
      teamArea,
      h('label', { class: 'field', for: 'r-per' }, 'Reviews per application',
        h('span', { class: 'hint' }, 'Applications are shared out automatically, with each new one going to the people with the fewest. Use 0 for every reviewer to read everything.'),
        h('input', { id: 'r-per', type: 'number', min: '0', max: '20', style: 'max-width:120px', value: form.reviews_per, oninput: (e) => { form.reviews_per = Number(e.target.value); } }))),
    box,
    h('div', { class: 'row' }, statusButtons, save)),
  ], { narrow: true });
}

// ---- Scoring ----
async function viewReview(id) {
  const next = reviewSteps > 0
    ? await api('GET', `/api/roles/${id}/previous?steps=${reviewSteps}`)
    : await api('GET', `/api/roles/${id}/next`);
  if (next.done) {
    return shell([
      h('h1', null, 'All scored'),
      h('p', { class: 'lede' }, `You have scored every answer for ${next.role}.`),
      h('div', { class: 'row' },
        h('button', { class: 'btn primary', onclick: () => go(`/roles/${id}`) }, 'See the ranking'),
        next.scored > 0 && h('button', { class: 'quiet', onclick: () => { reviewSteps = 1; render(); } }, 'Change a score')),
    ], { narrow: true });
  }
  let chosen = next.score ?? null;
  const box = errorBox();
  const note = h('textarea', { id: 'score-note', style: 'min-height:70px', value: next.note ?? '' });
  const save = h('button', { class: 'btn primary', disabled: chosen == null }, next.back ? 'Save and go forward' : 'Save and next answer');
  const choose = (value) => {
    chosen = value;
    buttons.forEach((b, j) => b.setAttribute('aria-pressed', String(j === value - 1)));
    save.disabled = false;
  };
  const buttons = SCORE_LABELS.map((label, i) => h('button', {
    type: 'button', 'aria-pressed': String(chosen === i + 1), onclick: () => choose(i + 1),
  }, h('b', null, i + 1), label));
  const submit = action(save, box, async () => {
    await api('POST', '/api/scores', { ticket: next.ticket, score: chosen, note: note.value });
    reviewSteps = Math.max(reviewSteps - 1, 0);
    render();
    window.scrollTo(0, 0);
  });
  save.addEventListener('click', submit);

  // Number keys score, and Enter saves, without reaching for the mouse.
  keyHandler = (e) => {
    if (['TEXTAREA', 'INPUT'].includes(e.target.tagName)) return;
    if (/^[1-5]$/.test(e.key)) { e.preventDefault(); choose(Number(e.key)); }
    if (e.key === 'Enter' && chosen != null && e.target.tagName !== 'BUTTON') { e.preventDefault(); submit(); }
  };
  document.addEventListener('keydown', keyHandler);

  const flagArea = h('div', { class: 'stack' });
  const openFlag = () => {
    const flagBox = errorBox();
    const phrase = h('input', { id: 'flag-phrase', type: 'text' });
    const send = h('button', { class: 'btn', type: 'button' }, 'Send to hiring lead');
    send.addEventListener('click', action(send, flagBox, async () => {
      await api('POST', '/api/flags', { ticket: next.ticket, phrase: phrase.value });
      flagArea.replaceChildren(h('p', { class: 'muted small' }, 'Sent. A hiring lead can remove those words for every reviewer.'));
    }));
    flagArea.replaceChildren(h('label', { class: 'field', for: 'flag-phrase' }, 'Copy the words that reveal who wrote this', phrase), flagBox, h('div', { class: 'row' }, send));
  };
  flagArea.append(h('div', null, h('button', { class: 'quiet', type: 'button', onclick: openFlag }, 'This reveals who wrote it')));

  const pct = next.total ? Math.round((next.scored / next.total) * 100) : 0;
  return shell([
    h('div', { class: 'stack' },
      h('div', { class: 'row between' }, h('div', { class: 'eyebrow' }, `${next.role} · Question ${next.question.position} of ${next.question.count}`),
        h('span', { class: 'small muted num' }, `${next.scored} of ${next.total}`)),
      h('div', { class: 'meter' }, h('i', { style: `width:${pct}%` }))),
    h('div', { class: 'stack' }, h('h2', { class: 'prompt' }, next.question.prompt),
      next.question.guidance && h('p', { class: 'muted' }, next.question.guidance)),
    h('article', { class: 'answer pre' }, redacted(next.text)),
    h('section', { class: 'stack' },
      h('div', { class: 'scale', role: 'group', 'aria-label': 'Score from 1 to 5' }, buttons),
      h('label', { class: 'field', for: 'score-note' }, 'Note (optional)', note),
      box,
      h('div', { class: 'row between' },
        h('div', { class: 'row' }, save,
          next.scored > 0 && h('button', { class: 'btn', onclick: () => { reviewSteps += 1; render(); window.scrollTo(0, 0); } }, 'Previous')),
        h('span', { class: 'hint keys' }, 'Keys 1 to 5 score. Enter saves.')),
      flagArea),
  ], { narrow: true });
}

// ---- Ranking ----
async function viewBoard(id) {
  const b = await api('GET', `/api/roles/${id}/board`);
  if (b.locked) {
    return shell([
      h('h1', null, b.role.title),
      h('p', { class: 'lede' }, `The ranking opens when you finish scoring. ${b.remaining} ${b.remaining === 1 ? 'answer' : 'answers'} left.`),
      h('div', { class: 'row' }, h('button', { class: 'btn primary', onclick: () => go(`/roles/${id}/review`) }, 'Continue scoring')),
    ]);
  }
  const box = errorBox();
  const undecided = b.rows.filter((r) => r.status === 'submitted');
  const allDone = b.rows.length > 0 && b.rows.every((r) => r.complete);
  const advanced = b.rows.some((r) => r.status === 'advanced');
  const closed = b.role.status === 'closed';

  // A two-step button, so a bulk decision always takes a second, deliberate click.
  const twoStep = (label, confirmLabel, explain, url, done) => {
    const area = h('div', { class: 'row' });
    const draw = (confirming) => {
      if (!confirming) return area.replaceChildren(h('button', { class: 'btn', onclick: () => draw(true) }, label));
      const yes = h('button', { class: 'btn danger' }, confirmLabel);
      yes.addEventListener('click', action(yes, box, async () => {
        const res = await api('POST', url, {});
        toast(done(res));
        render();
      }));
      return area.replaceChildren(h('span', { class: 'grow small' }, explain), yes, h('button', { class: 'quiet', onclick: () => draw(false) }, 'Cancel'));
    };
    draw(false);
    return area;
  };

  const status = (r) => {
    if (r.status !== 'submitted') return pill(r.status, r.stage ?? STATUS_LABELS[r.status]);
    return r.complete ? null : pill('', 'Scoring');
  };
  const scan = b.scan;
  const asideOpen = scan?.rows.filter((r) => r.status === 'submitted').length ?? 0;
  const open = (code) => go(`/roles/${id}/a/${code}`);

  return shell([
    h('div', { class: 'row between' },
      h('div', { class: 'row' }, h('h1', null, b.role.title), pill(b.role.status, ROLE_LABELS[b.role.status])),
      h('div', { class: 'row' },
        (b.has_pipeline || b.is_admin) && h('button', { class: 'btn', onclick: () => go(`/roles/${id}/pipeline`) }, 'Pipeline'),
        b.is_admin && !DEMO && h('a', { class: 'quiet', href: `/api/roles/${id}/export.csv`, download: 'scores.csv' }, 'Export'))),
    scan?.enabled && scan.total > 0 && h('dl', { class: 'tally' },
      h('div', { class: 'tally-hero' }, h('dt', null, 'Applied'), h('dd', { class: 'num' }, scan.total)),
      h('div', { class: 'tally-accent' }, h('dt', null, 'To read'), h('dd', { class: 'num' }, scan.to_read)),
      h('div', { class: 'tally-secondary' }, h('dt', null, 'Set aside'), h('dd', { class: 'num' }, scan.set_aside)),
      scan.waiting > 0 && h('div', null, h('dt', null, 'Scanning'), h('dd', { class: 'num' }, scan.waiting))),
    // One or two spot-checks prove little, so the warning waits for a fair sample.
    scan?.sampled >= 3 && scan.missed / scan.sampled >= 0.5 && h('p', { class: 'warn' }, `Reviewers rated ${scan.missed} of ${scan.sampled} spot-checks highly. The scan may be too strict, so check the set-aside pile closely.`),
    scan?.sampled > 0 && scan.sampled < 3 && h('p', { class: 'muted small' }, `Spot-checks: ${scan.missed} of ${scan.sampled} rated highly. Too few to judge the scan yet.`),
    b.pending.length > 0 && h('p', { class: 'muted' }, `Still scoring: ${b.pending.map((p) => `${p.name} (${p.remaining})`).join(', ')}`),
    b.role.status === 'open' && h('p', { class: 'muted' }, 'Decisions open once applications close.'),
    b.rows.length ? h('div', { class: 'table-wrap' }, h('table', null,
      h('thead', null, h('tr', null,
        h('th', { class: 'q-col' }, 'Rank'), h('th', null, 'Reference'), h('th', null, 'Score'),
        b.questions.map((q, i) => h('th', { class: 'q-col', title: q.prompt }, `Q${i + 1}`)),
        b.is_admin && h('th', { class: 'q-col' }, 'Reviewers'),
        h('th', null, ''))),
      h('tbody', null, b.rows.map((r, i) => h('tr', {
        class: 'click', tabindex: '0', role: 'link', onclick: () => open(r.code),
        onkeydown: (e) => { if (e.key === 'Enter') open(r.code); },
      },
      h('td', { class: 'num muted q-col' }, i + 1),
      h('td', { class: 'code' }, r.code),
      h('td', { class: 'scorecell num' }, r.score == null ? '–' : r.score.toFixed(2)),
      b.questions.map((q) => h('td', { class: 'num muted q-col' }, r.per_question[q.id] == null ? '–' : r.per_question[q.id].toFixed(1))),
      b.is_admin && h('td', { class: 'muted small q-col' }, (r.assigned ?? []).join(', ')),
      h('td', null, h('div', { class: 'row end' }, r.scan === 'sampled' && pill('', 'Spot-check'), r.discuss && pill('discuss', 'Split'), status(r))))))))
      : h('p', { class: 'muted' }, 'No applications to read yet.'),
    b.is_admin && b.undoable > 0 && h('div', { class: 'row' }, (() => {
      const undoAll = h('button', { class: 'btn' }, `Undo ${b.undoable} recent ${b.undoable === 1 ? 'decision' : 'decisions'}`);
      undoAll.addEventListener('click', action(undoAll, box, async () => {
        const res = await api('POST', `/api/roles/${id}/undo-recent`, {});
        toast(`Undid ${res.undone}. No emails went out.`);
        render();
      }));
      return undoAll;
    })(), h('span', { class: 'hint' }, `Emails wait ${b.grace_minutes} minutes.`)),
    b.flags?.length > 0 && h('section', { class: 'stack panel' },
      h('h2', null, 'Reported by reviewers'),
      b.flags.map((f) => h('div', { class: 'row between' },
        h('span', { class: 'grow' }, h('span', { class: 'code' }, f.code), ` “${f.phrase}”`),
        h('div', { class: 'row' },
          h('button', { class: 'btn', onclick: async () => { try { await api('POST', `/api/flags/${f.id}/remove`, {}); toast('Removed from every answer'); render(); } catch (err) { toast(err.message); } } }, 'Remove words'),
          h('button', { class: 'quiet', onclick: async () => { try { await api('POST', `/api/flags/${f.id}/dismiss`, {}); render(); } catch (err) { toast(err.message); } } }, 'Keep'))))),
    b.is_admin && closed && allDone && undecided.length > 0 && advanced && twoStep(
      `Decline the remaining ${undecided.length}`, `Decline ${undecided.length}`,
      `Each person is emailed in ${b.grace_minutes} minutes. Their details stay sealed.`,
      `/api/roles/${id}/decline-rest`, (res) => `Declined ${res.declined}. Undo within ${b.grace_minutes} minutes.`,
    ),
    scan && scan.rows.length > 0 && h('section', { class: 'stack' },
      h('h2', null, 'Set aside'),
      h('p', { class: 'muted' }, 'Nobody has been declined. Check the reasons, then send any back to reviewers or decline them.'),
      h('div', null, scan.rows.map((r) => h('button', { class: 'aside', onclick: () => open(r.code) },
        h('span', { class: 'code' }, r.code),
        h('span', { class: 'grow' }, r.reasons.join(' ')),

async function viewApplication(id, code) {
  const base = `/api/roles/${id}/applications/${encodeURIComponent(code)}`;

    const open = h('button', { class: 'btn primary' }, 'Open contact details');

  let pipelineSection = null;

      const save = h('button', { class: 'btn', disabled: chosen == null }, a.pipeline.my_feedback ? 'Update my scorecard' : 'Submit my scorecard');

      }, h('b', null, i + 1), label));

      }));
      return h('div', { class: 'stack' },
        h('h3', null, `Your scorecard for ${current.name}`),

        h('h3', null, x.name),

          h('span', { class: 'num' }, `${f.score}/5`), ' ', h('span', { class: 'muted' }, f.reviewer), f.note && h('span', { class: 'muted' }, ` · ${f.note}`)))))),

  return shell([

        a.discuss && pill('discuss', 'Split')),

      reasons.map((r) => h('p', null, r)),

      h('p', { class: 'muted small' }, `The email goes out in ${a.grace_minutes} minutes. Advancing unlocks contact details, and opening them makes the decision final.`)),

    a.is_admin && a.can_undo && h('div', { class: 'row' }, undo),
    box,
    h('div', { class: 'stack lg' }, a.answers.map((ans) => h('section', { class: 'stack qa' },
      h('div', { class: 'row between' }, h('h3', { class: 'grow' }, ans.prompt),

}

// ---- Pipeline ----
// Lets a hiring lead add, rename, reorder and remove a job's stages, right on the pipeline page.
function stageEditor(id, saved, onClose) {
  const box = errorBox();
  const stages = saved.map((x) => ({ ...x }));
  const list = h('div', { class: 'stack' });
  function draw() {
    list.replaceChildren(...stages.map((st, i) => h('div', { class: 'qcard' },
      h('div', { class: 'qgrid' },
        h('label', { class: 'field', for: `st-name-${i}` }, 'Stage name', h('input', { id: `st-name-${i}`, type: 'text', value: st.name, oninput: (e) => { st.name = e.target.value; } })),
        h('label', { class: 'field', for: `st-type-${i}` }, 'Type',
          h('select', { id: `st-type-${i}`, onchange: (e) => { st.type = e.target.value; draw(); } },
            Object.entries(STAGE_TYPE_LABELS).map(([v, l]) => h('option', { value: v, selected: st.type === v }, l))))),
      ['task', 'interview', 'references'].includes(st.type) && h('label', { class: 'field', for: `st-prompt-${i}` }, st.type === 'task' ? 'The task' : 'What to tell them',
        h('textarea', { id: `st-prompt-${i}`, style: 'min-height:70px', value: st.prompt ?? '', oninput: (e) => { st.prompt = e.target.value; } })),
      st.type === 'interview' && h('label', { class: 'field', for: `st-book-${i}` }, 'Booking link',
        h('span', { class: 'hint' }, 'From Calendly, Google Calendar or similar. It goes in the email as a button.'),
        h('input', { id: `st-book-${i}`, type: 'text', value: st.booking_url ?? '', oninput: (e) => { st.booking_url = e.target.value; } })),
      h('div', { class: 'qgrid' },
        st.type === 'task' && h('label', { class: 'field', for: `st-due-${i}` }, 'Days to complete', h('input', { id: `st-due-${i}`, type: 'number', min: '1', max: '60', value: st.due_days ?? 7, oninput: (e) => { st.due_days = Number(e.target.value); } })),
        st.type !== 'hired' && h('label', { class: 'field', for: `st-stall-${i}` }, 'Alert after (days)', h('input', { id: `st-stall-${i}`, type: 'number', min: '1', max: '60', value: st.stall_days ?? 5, oninput: (e) => { st.stall_days = Number(e.target.value); } }))),
      h('details', null, h('summary', { class: 'quiet' }, 'Customise this email'),
        h('label', { class: 'field', for: `st-mail-${i}` }, 'Message',
          h('span', { class: 'hint' }, 'Leave blank for the standard message. Fields: {{first_name}}, {{role}}, {{org}}, {{stage}}, {{brief}}, {{due}}, {{booking_link}}, {{status_link}}'),
          h('textarea', { id: `st-mail-${i}`, style: 'min-height:120px', value: st.email_text ?? '', oninput: (e) => { st.email_text = e.target.value; } }))),
      h('div', { class: 'row' },
        i > 0 && h('button', { type: 'button', class: 'quiet', onclick: () => { stages.splice(i - 1, 0, stages.splice(i, 1)[0]); draw(); } }, 'Move up'),
        h('button', { type: 'button', class: 'quiet', onclick: () => { stages.splice(i, 1); draw(); } }, 'Remove')))));
  }
  draw();
  const save = h('button', { class: 'btn primary', type: 'button' }, 'Save stages');
  save.addEventListener('click', action(save, box, async () => {
    await api('POST', `/api/roles/${id}/stages`, { stages });

  return h('section', { class: 'stack panel' },

      h('button', { type: 'button', class: 'btn', onclick: () => { stages.push({ name: 'New stage', type: 'interview', stall_days: 5 }); draw(); } }, 'Add stage'),

let stageSetupOpen = false;

    class: `card${c.stalled ? ' stalled' : ''}`, draggable: p.is_admin ? 'true' : null,

    ondragend: (e) => e.currentTarget.classList.remove('lifted'),

  h('button', { class: 'card-open', onclick: () => go(`/roles/${id}/a/${c.code}`) },

    stage.type !== 'hired' && (c.stalled ? pill('discuss', `Waiting ${c.days}d`) : c.days > 0 && h('span', { class: 'hint' }, `${c.days}d`))),
  p.is_admin && h('select', {
    class: 'inline card-move', id: `card-move-${c.code}`, 'aria-label': `Move ${c.name ?? c.code}`,

  return shell([

        p.is_admin && h('button', { class: 'btn', onclick: () => { stageSetupOpen = !stageSetupOpen; render(); } }, stageSetupOpen ? 'Close stage setup' : 'Set up stages'),
        h('button', { class: 'btn', onclick: () => go(`/roles/${id}`) }, 'Ranking'))),

      h('div', { class: 'funnel-bar' }, h('i', { style: `height:${Math.max((f.count / top) * 100, f.count ? 4 : 0)}%` })),
      h('div', { class: 'funnel-num num' }, f.count),
      h('div', { class: 'hint' }, f.label),
      f.days >= 0.5 && f.count > 0 && h('div', { class: 'hint num' }, `${f.days}d avg`)))),
    h('div', { class: 'kanban' }, p.stages.map((stage) => h('section', {
      class: 'column',
      ondragover: p.is_admin ? (e) => { e.preventDefault(); e.currentTarget.classList.add('over'); } : null,

// ---- Emails ----
async function viewEmails() {
  const s = await api('GET', '/api/settings');
  const items = [
    { kind: 'confirm', name: 'Application received', when: 'As soon as someone applies', cta: 'View your application' },
    { kind: 'advance', name: 'Moving forward', when: `${s.grace_minutes} minutes after you advance someone` },
    { kind: 'decline', name: 'Not moving forward', when: `${s.grace_minutes} minutes after you decline someone` },
    { kind: 'stage', name: 'Next step in the pipeline', when: 'Each time someone moves to a stage', readonly: true },
  ];
  s.templates.stage = 'Hi {{first_name}},\n\nWe would like to meet you for First interview on {{role}}. Your name has now been opened to the team.\n\nA 30 minute conversation with the hiring lead.\n\n{{booking_link}}\n\n{{status_link}}';
  s.subjects.stage = 'Next step: First interview for {{role}}';
  const HEADINGS = { confirm: 'Application received', advance: 'You are moving forward', decline: 'Thank you for applying', stage: 'Next step: First interview' };
  let current = items[0];
  let width = 'phone';
  const sample = {
    first_name: 'Jordan', role: 'Investment Analyst', org: s.org_name, code: 'K7M-2QX',
    retention_days: String(s.retention_days), status_link: '{{status_link}}', booking_link: '{{booking_link}}',
  };
  const fillIn = (text) => text.replace(/\{\{(\w+)\}\}/g, (m, k) => sample[k] ?? m);

  const list = h('div', { class: 'mail-list' });
  const editor = h('div', { class: 'stack' });
  const stage = h('div', { class: 'stage' });

  // The email layout: one column, large text and a full-width button, so it reads well at any phone width.
  function drawPreview() {
    const blocks = fillIn(s.templates[current.kind]).split(/\n\s*\n/).map((b) => b.trim()).filter(Boolean);
    const body = blocks.flatMap((block) => {
      const lines = block.split('\n');
      const isLink = (l) => l === '{{status_link}}' || l === '{{booking_link}}';
      const text = lines.filter((l) => !isLink(l)).join('\n');
      return [
        text && h('p', { class: 'mail-p' }, text),
        lines.filter(isLink).map((l) => h('div', { class: 'mail-cta' }, l === '{{booking_link}}' ? 'Book a time' : current.cta ?? 'View your application')),
      ];
    });
    const b = s.brand;
    const accent = b.accent ?? '#3457f5';
    const heroColor = b.hero ?? '#101a3f';
    stage.replaceChildren(
      h('div', { class: 'row seg', role: 'group', 'aria-label': 'Preview size' },
        ['phone', 'desktop'].map((w) => h('button', {
          type: 'button', class: width === w ? 'on' : null, 'aria-pressed': String(width === w),
          onclick: () => { width = w; drawPreview(); },
        }, w === 'phone' ? 'iPhone' : 'Desktop'))),
      h('div', { class: `device ${width}` },
        h('div', { class: 'device-meta' },
          h('div', { class: 'device-from' }, s.org_name),
          h('div', { class: 'device-subject' }, fillIn(s.subjects[current.kind]))),
        h('div', { class: 'mail' },
          h('div', { class: `mail-head${b.header === 'dark' ? ' dark' : ''}`, style: b.header === 'dark' ? `background:${heroColor}` : null },
            b.logo ? h('img', { class: 'mail-logo', src: b.logo, alt: s.org_name }) : s.org_name),
          h('div', { class: `mail-hero${b.header === 'dark' ? ' dark' : ''}`, style: b.header === 'dark' ? `background:${heroColor}` : null },
            h('i', { style: `background:${accent}` }),
            h('h2', null, HEADINGS[current.kind])),
          ['confirm', 'stage'].includes(current.kind) && h('div', { class: 'mail-steps' },
            h('div', { class: 'mail-bars' }, [0, 1, 2, 3, 4, 5, 6, 7].map((n) => h('i', { style: n <= (current.kind === 'stage' ? 3 : 0) ? `background:${accent}` : null }))),
            h('p', null, current.kind === 'stage' ? 'Step 4 of 8: First interview' : 'Step 1 of 8: Applied')),
          h('div', { class: 'mail-body' }, body),
          h('div', { class: 'mail-foot' }, `Reference ${sample.code}. Sent by ${s.org_name}.`)))
    );
  }

  function drawList() {
    list.replaceChildren(...items.map((i) => h('div', { class: `mail-row${i === current ? ' on' : ''}` },
      h('button', { type: 'button', class: 'mail-pick', onclick: () => { current = i; drawList(); drawEditor(); drawPreview(); } },
        h('span', { class: 'mail-name' }, i.name), h('span', { class: 'hint' }, i.when)),
      !i.readonly && h('label', { class: 'switch', for: `auto-${i.kind}` },
        h('input', {
          id: `auto-${i.kind}`, type: 'checkbox', checked: s.auto[i.kind], 'aria-label': `Send ${i.name} automatically`,
          onchange: async (e) => {
            s.auto[i.kind] = e.target.checked;
            try {
              await api('PUT', '/api/settings', { ...s, templates: { confirm: s.templates.confirm, advance: s.templates.advance, decline: s.templates.decline } });
              toast(e.target.checked ? `${i.name} will send automatically` : `${i.name} is off. People will only see the outcome on their status page.`);
            } catch (err) { toast(err.message); }
          },
        }),
        h('i')))));
  }

  const box = errorBox();
  function drawEditor() {
    if (current.readonly) {
      editor.replaceChildren(h('p', { class: 'muted' }, 'Each job sets these on its Pipeline page, under Set up stages. This is how an interview invitation looks.'));
      return;
    }
    const save = h('button', { class: 'btn primary', type: 'button' }, 'Save email');
    save.addEventListener('click', action(save, box, async () => {
      await api('PUT', '/api/settings', { ...s, templates: { confirm: s.templates.confirm, advance: s.templates.advance, decline: s.templates.decline } });
      toast('Email saved');
    }));
    editor.replaceChildren(
      h('label', { class: 'field', for: 'mail-subject' }, 'Subject',
        h('span', { class: 'hint' }, 'Fields: {{role}}, {{org}}, {{code}}'),
        h('input', { id: 'mail-subject', type: 'text', value: s.subjects[current.kind], oninput: (e) => { s.subjects[current.kind] = e.target.value; drawPreview(); } })),
      h('label', { class: 'field', for: 'mail-body' }, 'Message',
        h('span', { class: 'hint' }, 'Fields: {{first_name}}, {{role}}, {{org}}, {{code}}, {{retention_days}}, {{status_link}}'),
        h('textarea', { id: 'mail-body', style: 'min-height:220px', value: s.templates[current.kind], oninput: (e) => { s.templates[current.kind] = e.target.value; drawPreview(); } })),
      box, h('div', { class: 'row' }, save),
    );
  }
  drawList(); drawEditor(); drawPreview();

  return shell([
    h('h1', null, 'Emails'),
    !DEMO && !s.mail_configured && h('p', { class: 'muted' }, 'Email sending is not connected yet, so messages wait in the queue under Activity.'),
    list,
    h('div', { class: 'mail-grid' }, editor, stage),
  ]);
}

const ACCESS_LABELS = { master: 'Master', lead: 'Hiring lead', reviewer: 'Reviewer' };
const accessOf = (u) => (u.master ? 'master' : u.role === 'admin' ? 'lead' : 'reviewer');

async function viewTeam() {
  const { users, areas } = await api('GET', '/api/users');
  const box = errorBox();
  const name = h('input', { id: 'inv-name', type: 'text' });
  const email = h('input', { id: 'inv-email', type: 'email' });
  const role = h('select', { id: 'inv-role' }, Object.entries({ reviewer: 'Reviewer', admin: 'Hiring lead', master: 'Master' }).map(([v, l]) => h('option', { value: v }, l)));
  let invAreas = [];
  const result = h('div', { class: 'stack' });
  const showLink = (who, url) => {
    result.replaceChildren(h('div', { class: 'notice stack' },
      h('strong', null, `Send this link to ${who}`),
      h('span', { class: 'code wrap' }, url),
      h('span', { class: 'small' }, 'It lets them set a password and works once.')));
  };
  const submit = h('button', { class: 'btn primary', type: 'submit' }, 'Create invite');
  const update = async (u, change, done) => {
    try {
      await api('POST', `/api/users/${u.id}/access`, change);
      if (done) toast(done);
      render();
    } catch (err) { toast(err.message); render(); }
  };
  const areaChips = (selected, onChange, prefix) => h('div', { class: 'chips' }, areas.map((a) => h('label', { class: `chip${selected.includes(a) ? ' on' : ''}`, for: `${prefix}-${a}` },
    h('input', {
      id: `${prefix}-${a}`, type: 'checkbox', checked: selected.includes(a),
      onchange: (e) => {
        e.target.parentElement.classList.toggle('on', e.target.checked);
        onChange(e.target.checked ? [...selected, a] : selected.filter((x) => x !== a));
      },
    }), a)));

  return shell([
    h('div', { class: 'stack' }, h('h1', null, 'Team')),
    h('dl', { class: 'levels' },
      h('div', null, h('dt', null, 'Master'), h('dd', null, 'Everything, including team, brand, emails and the activity log.')),
      h('div', null, h('dt', null, 'Hiring lead'), h('dd', null, 'Runs the jobs they lead, makes decisions, and opens contact details of people they advance.')),
      h('div', null, h('dt', null, 'Reviewer'), h('dd', null, 'Scores only the responses assigned to them.'))),
    h('section', null, h('div', { class: 'table-wrap' }, h('table', null,
      h('thead', null, h('tr', null, h('th', null, 'Name'), h('th', null, 'Access'), h('th', null, 'Job areas'), h('th', null, 'Status'), h('th', null, ''))),
      h('tbody', null, users.map((u) => h('tr', null,
        h('td', null, u.name, h('div', { class: 'hint' }, u.email)),
        h('td', null, h('select', {
          id: `access-${u.id}`, 'aria-label': `Access for ${u.name}`, class: 'inline',
          onchange: (e) => update(u, { access: e.target.value }, `${u.name} is now ${ACCESS_LABELS[e.target.value]}`),
        }, Object.entries(ACCESS_LABELS).map(([v, l]) => h('option', { value: v, selected: accessOf(u) === v }, l)))),
        h('td', null, accessOf(u) === 'master' ? h('span', { class: 'hint' }, 'All jobs') : areaChips(u.areas, (next) => update(u, { areas: next }), `area-${u.id}`)),
        h('td', null, u.joined ? pill('', 'Active') : pill('queued', 'Invited')),
        h('td', null, u.id !== state.user.id && h('div', { class: 'row' },
          h('button', { class: 'quiet', onclick: async () => {
            try { const r = await api('POST', `/api/users/${u.id}/reset`, {}); showLink(u.name, r.invite_url); } catch (err) { toast(err.message); }
          } }, 'Reset password'),
          h('button', { class: 'quiet', onclick: async () => {
            try { await api('POST', `/api/users/${u.id}/remove`, {}); toast(`${u.name} removed. Their unscored responses were reassigned.`); render(); } catch (err) { toast(err.message); }
          } }, 'Remove')))))))),
    ),
    h('form', {
      class: 'stack',
      onsubmit: action(submit, box, async () => {
        const res = await api('POST', '/api/users', { name: name.value, email: email.value, role: role.value, areas: invAreas });
        showLink(name.value, res.invite_url);
        name.value = ''; email.value = '';
      }),
    },
    h('h2', null, 'Invite someone'),
    h('div', { class: 'two' },
      h('label', { class: 'field', for: 'inv-name' }, 'Name', name),
      h('label', { class: 'field', for: 'inv-email' }, 'Email', email)),
    h('label', { class: 'field', for: 'inv-role' }, 'Access', role),
    h('div', { class: 'field' }, h('span', null, 'Job areas'),
      h('span', { class: 'hint' }, 'They join running jobs in these areas straight away.'),
      (() => {
        const holder = h('div', null);
        const draw = () => holder.replaceChildren(areaChips(invAreas, (next) => { invAreas = next; draw(); }, 'inv-area'));
        draw();
        return holder;
      })()),
    box, h('div', { class: 'row' }, submit), result),
  ]);
}

// ---- Activity ----
async function viewActivity() {
  const a = await api('GET', '/api/activity');
  const actionLabels = {
    application_received: 'Application received', application_withdrawn: 'Applicant withdrew', advanced: 'Advanced', declined: 'Declined',
    decision_undone: 'Decision undone', stage_moved: 'Moved stage', stage_work_received: 'Response received', identity_opened: 'Opened contact details', contact_deleted: 'Contact details deleted',
    scan_through: 'Scan: to read', scan_set_aside: 'Scan: set aside', scan_sampled: 'Scan: spot-check', scan_failed: 'Scan failed', scan_overruled: 'Sent to reviewers', scan_rerun: 'Scan run again', access_changed: 'Access changed',
    role_created: 'Role created', role_updated: 'Role updated', role_opened: 'Role opened', role_closed: 'Role closed',
    team_invited: 'Invited to team', team_removed: 'Removed from team', password_reset: 'Password reset issued', settings_updated: 'Settings updated',
  };
  const emailStatus = { queued: 'Waiting', sent: 'Sent', cancelled: 'Cancelled' };
  return shell([
    h('h1', null, 'Activity'),
    !a.mail_configured && !DEMO && h('div', { class: 'warn' }, 'Email is not connected yet, so messages are waiting here and will send once it is. Applicants can still see their outcome on their status page.'),
    h('section', { class: 'stack' }, h('h2', null, 'Log'), h('div', { class: 'table-wrap' }, h('table', null,
      h('thead', null, h('tr', null, h('th', null, 'When'), h('th', null, 'Who'), h('th', null, 'What'), h('th', null, 'Reference'), h('th', null, 'Detail'))),
      h('tbody', null, a.audit.map((e) => h('tr', null,
        h('td', { class: 'num', style: 'white-space:nowrap' }, fmtDateTime(e.at)),
        h('td', null, e.actor === 'system' ? 'Automatic' : e.actor === 'applicant' ? 'Applicant' : e.actor),
        h('td', null, actionLabels[e.action] ?? e.action),
        h('td', { class: 'code' }, e.code ?? ''),
        h('td', { class: 'muted' }, e.detail))))))),
    h('section', { class: 'stack' }, h('h2', null, 'Emails'), a.emails.length ? h('div', { class: 'table-wrap' }, h('table', null,
      h('thead', null, h('tr', null, h('th', null, 'Subject'), h('th', null, 'Reference'), h('th', null, 'Status'), h('th', null, 'Time'))),
      h('tbody', null, a.emails.map((m) => h('tr', null,
        h('td', null, m.subject), h('td', { class: 'code' }, m.code ?? ''),
        h('td', null, pill(m.status, emailStatus[m.status] ?? m.status), m.error && h('div', { class: 'small muted' }, m.error)),
        h('td', { class: 'num', style: 'white-space:nowrap' }, fmtDateTime(m.sent_at ?? m.send_after)))))))
      : h('p', { class: 'muted' }, 'No emails yet.')),
  ]);
}

// ---- Settings ----
async function viewSettings() {
  const s = await api('GET', '/api/settings');
  const box = errorBox();
  const save = h('button', { class: 'btn primary', type: 'submit' }, 'Save settings');
  const logoPreview = h('div', { class: 'logo-preview' });
  const drawLogo = () => {
    logoPreview.className = `logo-preview${s.brand.header === 'dark' ? ' dark' : ''}`;
    logoPreview.replaceChildren(s.brand.logo ? h('img', { class: 'logo', src: s.brand.logo, alt: 'Current logo' }) : s.org_name);
  };
  drawLogo();
  return shell([
    h('h1', null, 'Settings'),
    h('form', {
      class: 'stack lg',
      onsubmit: action(save, box, async () => {
        await api('PUT', '/api/settings', s);
        applyBrand({ ...s.brand, name: s.org_name });
        toast('Settings saved');
        render();
      }),
    },
    h('section', { class: 'stack' },
      h('h2', null, 'Brand'),
      logoPreview,
      h('label', { class: 'field', for: 's-org' }, 'Organisation name', h('input', { id: 's-org', type: 'text', value: s.org_name, oninput: (e) => { s.org_name = e.target.value; drawLogo(); } })),
      h('label', { class: 'field', for: 's-tagline' }, 'Careers tagline',
        h('span', { class: 'hint' }, 'Shown at the top of your open roles page.'),
        h('input', { id: 's-tagline', type: 'text', maxlength: '160', value: s.brand.tagline ?? '', oninput: (e) => { s.brand.tagline = e.target.value; } })),
      h('div', { class: 'two' },
        h('label', { class: 'field', for: 's-logo' }, 'Logo',
          h('input', {
            id: 's-logo', type: 'file', accept: 'image/svg+xml,image/png,image/jpeg,image/webp',
            onchange: (e) => {
              const file = e.target.files[0];
              if (!file) return;
              if (file.size > 300_000) { toast('Use a logo under 300 KB.'); return; }
              const reader = new FileReader();
              reader.onload = () => { s.brand.logo = String(reader.result); drawLogo(); };
              reader.readAsDataURL(file);
            },
          })),
        h('label', { class: 'field', for: 's-header' }, 'Header',
          h('select', { id: 's-header', onchange: (e) => { s.brand.header = e.target.value; drawLogo(); } },
            h('option', { value: 'light', selected: s.brand.header !== 'dark' }, 'Light'),
            h('option', { value: 'dark', selected: s.brand.header === 'dark' }, 'Dark')))),
      s.brand.logo && h('div', null, h('button', { type: 'button', class: 'quiet', onclick: () => { s.brand.logo = null; drawLogo(); } }, 'Remove logo')),
      h('div', { class: 'swatches' },
        h('label', { class: 'field', for: 's-accent' }, 'Main colour',
          h('input', { id: 's-accent', type: 'color', value: s.brand.accent ?? '#3457f5', oninput: (e) => { s.brand.accent = e.target.value; } })),
        h('label', { class: 'field', for: 's-secondary' }, 'Second colour',
          h('input', { id: 's-secondary', type: 'color', value: s.brand.secondary ?? '#9cc9ff', oninput: (e) => { s.brand.secondary = e.target.value; } })),
        h('label', { class: 'field', for: 's-hero' }, 'Banner colour',
          h('input', { id: 's-hero', type: 'color', value: s.brand.hero ?? '#101a3f', oninput: (e) => { s.brand.hero = e.target.value; } }))),
      h('div', { class: 'two' },
        h('label', { class: 'field', for: 's-font' }, 'Font',
          h('select', { id: 's-font', onchange: (e) => { s.brand.font = e.target.value; } },
            s.fonts.map((f) => h('option', { value: f, selected: s.brand.font === f }, f))))),
      h('label', { class: 'field', for: 's-icon' }, 'Browser tab icon',
        h('input', {
          id: 's-icon', type: 'file', accept: 'image/svg+xml,image/png,image/jpeg,image/webp',
          onchange: (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 100_000) { toast('Use an icon under 100 KB.'); return; }
            const reader = new FileReader();
            reader.onload = () => { s.brand.icon = String(reader.result); };
            reader.readAsDataURL(file);
          },
        }))),
    h('section', { class: 'stack' },
      h('h2', null, 'Job areas'),
      h('label', { class: 'field', for: 's-areas' }, 'One per line',
        h('span', { class: 'hint' }, 'Used to bring the right people onto each job automatically.'),
        h('textarea', { id: 's-areas', style: 'min-height:110px', value: s.areas.join('\n'), oninput: (e) => { s.areas = e.target.value.split('\n').map((x) => x.trim()).filter(Boolean); } }))),
    h('section', { class: 'stack' },
      h('h2', null, 'Privacy'),
      s.ai_available === false && h('p', { class: 'muted small' }, 'The AI scan is not connected. Roles use rule checks only.'),
      h('label', { class: 'field', for: 's-privacy' }, 'Privacy notice',
        h('span', { class: 'hint' }, 'Shown on the application form. This is a starting draft, so have it legally reviewed.'),
        h('textarea', { id: 's-privacy', style: 'min-height:220px', value: s.privacy_notice, oninput: (e) => { s.privacy_notice = e.target.value; } })),
      h('label', { class: 'field', for: 's-retain' }, 'Delete declined applicants’ contact details after (days)',
        h('input', { id: 's-retain', type: 'number', min: '1', max: '730', value: s.retention_days, oninput: (e) => { s.retention_days = Number(e.target.value); } }))),
    box, h('div', { class: 'row' }, save)),
  ], { narrow: true });
}

// ---- Account ----
async function viewAccount() {
  const me = (await api('GET', '/api/me')).user;
  const pwBox = errorBox();
  const current = h('input', { id: 'pw-current', type: 'password', autocomplete: 'current-password' });
  const next = h('input', { id: 'pw-next', type: 'password', autocomplete: 'new-password' });
  const pwSave = h('button', { class: 'btn', type: 'submit' }, 'Change password');

  const twoBox = errorBox();
  const twoArea = h('div', { class: 'stack' });
  const showOff = () => {
    const start = h('button', { class: 'btn', type: 'button' }, 'Turn on');
    start.addEventListener('click', action(start, twoBox, async () => {
      const setup = await api('POST', '/api/2fa/start', {});
      const code = h('input', { id: 'two-code', type: 'text', inputmode: 'numeric', autocomplete: 'one-time-code' });
      const confirm = h('button', { class: 'btn primary', type: 'button' }, 'Confirm');
      confirm.addEventListener('click', action(confirm, twoBox, async () => {
        const done = await api('POST', '/api/2fa/confirm', { code: code.value });
        twoArea.replaceChildren(
          h('p', null, 'Two-step sign-in is on. Save these recovery codes somewhere safe. Each works once, and you will not see them again.'),
          h('div', { class: 'panel code wrap recovery' }, done.recovery_codes.join('  ')));
      }));
      twoArea.replaceChildren(
        h('p', { class: 'muted' }, 'Scan this with an authenticator app, then enter the code it shows.'),
        h('img', { class: 'qr', src: setup.qr, alt: 'QR code for your authenticator app' }),
        h('p', { class: 'small muted' }, 'Or enter this key: ', h('span', { class: 'code wrap' }, setup.key)),
        h('label', { class: 'field', for: 'two-code' }, 'Code', code),
        h('div', { class: 'row' }, confirm));
    }));
    twoArea.replaceChildren(h('p', { class: 'muted' }, 'Off. Recommended for anyone who can open contact details.'), h('div', { class: 'row' }, start));
  };
  const showOn = () => {
    const pw = h('input', { id: 'two-off-pw', type: 'password', autocomplete: 'current-password' });
    const off = h('button', { class: 'btn', type: 'button' }, 'Turn off');
    off.addEventListener('click', action(off, twoBox, async () => {
      await api('POST', '/api/2fa/disable', { password: pw.value });
      showOff();
    }));
    twoArea.replaceChildren(h('p', null, 'On.'), h('label', { class: 'field', for: 'two-off-pw' }, 'Password, to turn it off', pw), h('div', { class: 'row' }, off));
  };
  if (me.two_factor) showOn(); else showOff();

  return shell([
    h('h1', null, 'Account'),
    h('section', { class: 'stack' }, h('h2', null, 'Two-step sign-in'), twoArea, twoBox),
    h('form', {
      class: 'stack',
      onsubmit: action(pwSave, pwBox, async () => {
        await api('POST', '/api/password', { current: current.value, password: next.value });
        current.value = ''; next.value = '';
        toast('Password changed');
      }),
    },
    h('h2', null, 'Password'),
    h('label', { class: 'field', for: 'pw-current' }, 'Current password', current),
    h('label', { class: 'field', for: 'pw-next' }, 'New password', h('span', { class: 'hint' }, 'At least 10 characters.'), next),
    pwBox, h('div', { class: 'row' }, pwSave)),
  ], { narrow: true });
}

// ---- Privacy ----
async function viewPrivacy() {
  const p = await api('GET', '/api/public/privacy');
  return shell([h('h1', null, 'Privacy notice'), h('p', { class: 'pre' }, p.text)], { narrow: true });
}

// ---- Router ----
const ROUTES = [
  [/^\/$/, () => (state.user ? viewDashboard() : viewHome())],
  [/^\/apply\/([^/]+)$/, viewApply],
  [/^\/status\/([^/]+)$/, viewStatus],
  [/^\/login$/, viewLogin],
  [/^\/invite\/([^/]+)$/, viewInvite],
  [/^\/dashboard$/, viewDashboard, 'user'],
  [/^\/team$/, viewTeam, 'master'],
  [/^\/emails$/, viewEmails, 'master'],
  [/^\/activity$/, viewActivity, 'master'],
  [/^\/settings$/, viewSettings, 'master'],
  [/^\/account$/, viewAccount, 'user'],
  [/^\/privacy$/, viewPrivacy],
  [/^\/roles\/new$/, () => viewRoleEdit(null), 'admin'],
  [/^\/roles\/([^/]+)\/edit$/, viewRoleEdit, 'admin'],
  [/^\/roles\/([^/]+)\/review$/, viewReview, 'user'],
  [/^\/roles\/([^/]+)\/a\/([^/]+)$/, viewApplication, 'user'],
  [/^\/roles\/([^/]+)\/pipeline$/, viewPipeline, 'user'],
  [/^\/roles\/([^/]+)$/, viewBoard, 'user'],
];

let renderId = 0;
async function render() {
  const id = ++renderId;
  const routePath = state.path;
  if (keyHandler) {
    document.removeEventListener('keydown', keyHandler);
    keyHandler = null;
  }
  const match = ROUTES.map(([re, fn, access]) => ({ m: re.exec(routePath), fn, access })).find((x) => x.m);
  try {
    if (DEMO) state.user = DEMO.currentUser();
    if (!match) throw Object.assign(new Error('We could not find that page.'), { status: 404 });
    if (match.access && !state.user) { go('/login', { replace: true }); return; }
    if (match.access === 'admin' && state.user.role !== 'admin') { go('/dashboard', { replace: true }); return; }
    if (match.access === 'master' && !state.user.master) { go('/dashboard', { replace: true }); return; }
    const nodes = await match.fn(...match.m.slice(1));
    if (id === renderId) paint(nodes);
  } catch (err) {
    if (err.status === 401 && !DEMO) { state.user = null; go('/login', { replace: true }); return; }
    if (id === renderId) {
      paint(shell([h('h1', null, 'That did not work'), h('div', null, h('p', null, err.message))], { narrow: true }));
    }
  }
}

(async () => {
  if (!DEMO) {
    try {
      const me = await api('GET', '/api/me');
      state.user = me.user;
      state.org = me.org;
      applyBrand(me.brand);
    } catch { /* The page shows its own error if the server is unreachable. */ }
  } else {
    applyBrand(DEMO.brand());
  }
  render();
})();

</script>
